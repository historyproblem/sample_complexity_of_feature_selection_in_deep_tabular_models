# @package _global_

training_arguments:
  num_epochs: 200
  batchnorm_recalibration:
    enabled: false

scheduler:
  T_max: 200

reporting:
  run_label_fields:
    pL: model.backbone.final_survival_probability

tuning:
  enabled: true
  mode: "grid"
  study_name: "stochastic_depth_resnet50_pL_grid_025_035_05_065_08_10_repeats3_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 6
  repeats_per_trial: 3
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.backbone.final_survival_probability: 0.25
      mlflow.run_name: stochastic_depth_resnet50_cifar10_pL025
      mlflow.tags.recipe: stochastic_depth_resnet50_cifar10_pL025
      mlflow.tags.final_survival_probability: "0.25"
      mlflow.tags.expected_active_blocks: "9.625"
      mlflow.tags.expected_disabled_blocks: "6.375"
      mlflow.tags.repeats_per_trial: "3"
    - model.backbone.final_survival_probability: 0.35
      mlflow.run_name: stochastic_depth_resnet50_cifar10_pL035
