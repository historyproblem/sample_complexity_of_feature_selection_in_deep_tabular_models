      mlflow.tags.expected_active_blocks: "10.475"
      mlflow.tags.expected_disabled_blocks: "5.525"
      mlflow.tags.repeats_per_trial: "3"
    - model.backbone.final_survival_probability: 0.5
      mlflow.run_name: stochastic_depth_resnet50_cifar10_pL05
      mlflow.tags.recipe: stochastic_depth_resnet50_cifar10_pL05
      mlflow.tags.final_survival_probability: "0.5"
      mlflow.tags.expected_active_blocks: "11.75"
      mlflow.tags.expected_disabled_blocks: "4.25"
      mlflow.tags.repeats_per_trial: "3"
    - model.backbone.final_survival_probability: 0.65
