# @package _global_

tuning:
  enabled: true
  mode: "grid"
  study_name: "gumbel_resnet50_mask_mode_triplet"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 3
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 20
    threshold: 0.4
    max_attempts_per_repeat: 3
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points:
    - model.lambda_coef: 0.0
      model.backbone.resnet_block.force_ones_mask: true
      model.backbone.resnet_block.deterministic_soft_mask: false
      model.backbone.resnet_block.deterministic_hard_mask: false
    - model.lambda_coef: 0.01
      model.backbone.resnet_block.force_ones_mask: false
      model.backbone.resnet_block.deterministic_soft_mask: true
      model.backbone.resnet_block.deterministic_hard_mask: false
    - model.lambda_coef: 0.01
      model.backbone.resnet_block.force_ones_mask: false
      model.backbone.resnet_block.deterministic_soft_mask: false
      model.backbone.resnet_block.deterministic_hard_mask: true
