# @package _global_

# Six runs total: one dense p_L=1 reference followed by five stochastic-depth
# settings. points_in_order keeps the dense reference first in the study.
training_arguments:
  num_epochs: 200
  batchnorm_recalibration:
    enabled: false

scheduler:
  T_max: 200

reporting:
  run_label_fields:
    pL: model.backbone.final_survival_probability

tuning:
  enabled: true
  mode: "grid"
  study_name: "stochastic_depth_resnet50_pL_flops_grid_dense_10_09_08_07_05_03_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 6
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.backbone.final_survival_probability: 1.0
      mlflow.run_name: stochastic_depth_resnet50_cifar10_pL10_dense_reference
      mlflow.tags.recipe: stochastic_depth_resnet50_cifar10_pL10_dense_reference
      mlflow.tags.variant: dense_reference
      mlflow.tags.final_survival_probability: "1.0"
      mlflow.tags.expected_active_blocks: "16.0"
      mlflow.tags.expected_disabled_blocks: "0.0"
      mlflow.tags.flops_protocol: dense_reference_train_and_inference
    - model.backbone.final_survival_probability: 0.9
      mlflow.run_name: stochastic_depth_resnet50_cifar10_pL09_flops
      mlflow.tags.recipe: stochastic_depth_resnet50_cifar10_pL09_flops
      mlflow.tags.variant: stochastic_depth
      mlflow.tags.final_survival_probability: "0.9"
      mlflow.tags.expected_active_blocks: "15.15"
      mlflow.tags.expected_disabled_blocks: "0.85"
      mlflow.tags.flops_protocol: dense_reference_train_and_inference
    - model.backbone.final_survival_probability: 0.8
      mlflow.run_name: stochastic_depth_resnet50_cifar10_pL08_flops
      mlflow.tags.recipe: stochastic_depth_resnet50_cifar10_pL08_flops
      mlflow.tags.variant: stochastic_depth
      mlflow.tags.final_survival_probability: "0.8"
      mlflow.tags.expected_active_blocks: "14.3"
      mlflow.tags.expected_disabled_blocks: "1.7"
      mlflow.tags.flops_protocol: dense_reference_train_and_inference
    - model.backbone.final_survival_probability: 0.7
      mlflow.run_name: stochastic_depth_resnet50_cifar10_pL07_flops
      mlflow.tags.recipe: stochastic_depth_resnet50_cifar10_pL07_flops
      mlflow.tags.variant: stochastic_depth
      mlflow.tags.final_survival_probability: "0.7"
      mlflow.tags.expected_active_blocks: "13.45"
      mlflow.tags.expected_disabled_blocks: "2.55"
      mlflow.tags.flops_protocol: dense_reference_train_and_inference
    - model.backbone.final_survival_probability: 0.5
      mlflow.run_name: stochastic_depth_resnet50_cifar10_pL05_flops
      mlflow.tags.recipe: stochastic_depth_resnet50_cifar10_pL05_flops
      mlflow.tags.variant: stochastic_depth
      mlflow.tags.final_survival_probability: "0.5"
      mlflow.tags.expected_active_blocks: "11.75"
      mlflow.tags.expected_disabled_blocks: "4.25"
      mlflow.tags.flops_protocol: dense_reference_train_and_inference
    - model.backbone.final_survival_probability: 0.3
      mlflow.run_name: stochastic_depth_resnet50_cifar10_pL03_flops
      mlflow.tags.recipe: stochastic_depth_resnet50_cifar10_pL03_flops
      mlflow.tags.variant: stochastic_depth
      mlflow.tags.final_survival_probability: "0.3"
      mlflow.tags.expected_active_blocks: "10.05"
      mlflow.tags.expected_disabled_blocks: "5.95"
      mlflow.tags.flops_protocol: dense_reference_train_and_inference
