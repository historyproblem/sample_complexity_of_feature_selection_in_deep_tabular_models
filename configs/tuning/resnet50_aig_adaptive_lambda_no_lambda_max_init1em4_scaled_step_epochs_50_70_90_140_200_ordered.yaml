  objective_metric: "valid_accuracy"
  n_trials: 5
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.lambda_coef: 0.0001
      training_arguments.num_epochs: 50
