      mlflow.tags.recipe: resnet50_aig_adaptive_lambda_no_lambda_max_init1em4_scaled_step_50ep
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "0.0001"
      mlflow.tags.target_lambda: "10"
      mlflow.tags.target_growth_steps: "16.6666666667"
      mlflow.tags.lambda_multiplier: "1.99526231497"
      mlflow.tags.lambda_max: "none"
      mlflow.tags.num_epochs: "50"
      mlflow.tags.update_every_epochs: "2"
