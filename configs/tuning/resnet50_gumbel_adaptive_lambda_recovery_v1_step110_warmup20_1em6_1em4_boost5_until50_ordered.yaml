# @package _global_

tuning:
  enabled: true
  mode: "grid"
  study_name: "resnet50_gumbel_adaptive_lambda_recovery_v1_step110_warmup20_1em6_1em4_boost5_until50_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 2
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 20
    threshold: 0.4
    max_attempts_per_repeat: 3
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.lambda_coef: 0.000001
      training_arguments.adaptive_lambda.log_step_init: 0.09531017980432493
      training_arguments.adaptive_lambda.update_every_epochs: 2
      training_arguments.adaptive_lambda.lambda_increase_warmup_epochs: 20
      training_arguments.adaptive_lambda.lambda_increase_warmup_every_epochs: 2
      training_arguments.adaptive_lambda.log_step_max_boost_level: 5
      training_arguments.adaptive_lambda.adaptive_log_step_max_epoch: 50
      mlflow.run_name: resnet50_gumbel_adaptive_lambda_recovery_v1_step110_lambda1em6_warmup20_boost5_until50_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_gumbel_adaptive_lambda_recovery_v1_step110_lambda1em6_warmup20_boost5_until50
      mlflow.tags.initial_lambda: "1e-6"
      mlflow.tags.log_step_multiplier: "1.1"
      mlflow.tags.lambda_increase_warmup_epochs: "20"
      mlflow.tags.lambda_increase_warmup_every_epochs: "2"
    - model.lambda_coef: 0.0001
      training_arguments.adaptive_lambda.log_step_init: 0.09531017980432493
      training_arguments.adaptive_lambda.update_every_epochs: 2
      training_arguments.adaptive_lambda.lambda_increase_warmup_epochs: 20
      training_arguments.adaptive_lambda.lambda_increase_warmup_every_epochs: 2
      training_arguments.adaptive_lambda.log_step_max_boost_level: 5
      training_arguments.adaptive_lambda.adaptive_log_step_max_epoch: 50
      mlflow.run_name: resnet50_gumbel_adaptive_lambda_recovery_v1_step110_lambda1em4_warmup20_boost5_until50_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_gumbel_adaptive_lambda_recovery_v1_step110_lambda1em4_warmup20_boost5_until50
      mlflow.tags.initial_lambda: "1e-4"
      mlflow.tags.log_step_multiplier: "1.1"
      mlflow.tags.lambda_increase_warmup_epochs: "20"
      mlflow.tags.lambda_increase_warmup_every_epochs: "2"
