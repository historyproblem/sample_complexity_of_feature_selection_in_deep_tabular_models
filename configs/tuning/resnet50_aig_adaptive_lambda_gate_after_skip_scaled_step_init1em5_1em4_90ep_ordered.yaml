# @package _global_

training_arguments:
  num_epochs: 90
  adaptive_lambda:
    enabled: true
    adaptive_log_step_enabled: false
    recovery:
      enabled: false
  batchnorm_recalibration:
    enabled: false
  collapse_guard:
    enabled: false

scheduler:
  T_max: 90

tuning:
  enabled: true
  mode: "grid"
  study_name: "resnet50_aig_adaptive_lambda_gate_after_skip_scaled_step_init1em5_1em4_90ep_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 2
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.lambda_coef: 0.00001
      training_arguments.adaptive_lambda.update_every_epochs: 2
      training_arguments.adaptive_lambda.log_step_init: 0.9210340371976182
      mlflow.run_name: resnet50_aig_adaptive_lambda_gate_after_skip_init1em5_to10_30ep_update2_90ep_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_aig_adaptive_lambda_gate_after_skip_init1em5_to10_30ep_update2_90ep
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.num_epochs: "90"
      mlflow.tags.initial_lambda: "1e-5"
      mlflow.tags.target_lambda: "10"
      mlflow.tags.target_growth_epochs: "30"
      mlflow.tags.lambda_multiplier: "2.5118864315"
      mlflow.tags.update_every_epochs: "2"
      mlflow.tags.adaptive_lambda: "enabled"
      mlflow.tags.adaptive_log_step: "disabled"
      mlflow.tags.recovery: "disabled"
      mlflow.tags.gate_placement: "after_skip"
    - model.lambda_coef: 0.0001
      training_arguments.adaptive_lambda.update_every_epochs: 2
      training_arguments.adaptive_lambda.log_step_init: 0.7675283643313485
      mlflow.run_name: resnet50_aig_adaptive_lambda_gate_after_skip_init1em4_to10_30ep_update2_90ep_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_aig_adaptive_lambda_gate_after_skip_init1em4_to10_30ep_update2_90ep
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.num_epochs: "90"
      mlflow.tags.initial_lambda: "1e-4"
      mlflow.tags.target_lambda: "10"
      mlflow.tags.target_growth_epochs: "30"
      mlflow.tags.lambda_multiplier: "2.1544346900"
      mlflow.tags.update_every_epochs: "2"
      mlflow.tags.adaptive_lambda: "enabled"
      mlflow.tags.adaptive_log_step: "disabled"
      mlflow.tags.recovery: "disabled"
      mlflow.tags.gate_placement: "after_skip"
