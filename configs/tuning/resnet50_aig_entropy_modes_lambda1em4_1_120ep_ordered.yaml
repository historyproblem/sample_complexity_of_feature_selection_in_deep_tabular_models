# @package _global_

training_arguments:
  num_epochs: 120
  gradient_norm_logging:
    enabled: true
    log_per_layer: true
    every_n_batches: 5
  adaptive_lambda:
    enabled: true
  batchnorm_recalibration:
    enabled: false

scheduler:
  T_max: 120

mlflow:
  enabled: true

tuning:
  enabled: true
  mode: "grid"
  study_name: "resnet50_aig_entropy_modes_lambda1em4_1_120ep_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 6
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.lambda_coef: 0.0001
      model.backbone.resnet_block.gate_regularization: l1_probability
      model.entropy_regularization: disabled
      mlflow.run_name: resnet50_aig_entropy_disabled_lambda1em4_120ep
      mlflow.tags.recipe: "resnet50_aig_entropy_modes_lambda1em4_1_120ep"
      mlflow.tags.initial_lambda: "0.0001"
      mlflow.tags.gate_regularization: "l1_probability"
      mlflow.tags.entropy_regularization: "disabled"
      mlflow.tags.repeats_per_trial: "1"
    - model.lambda_coef: 0.0001
      model.backbone.resnet_block.gate_regularization: l1_probability
      model.entropy_regularization: plus_negative_entropy
      mlflow.run_name: resnet50_aig_entropy_plus_neg_h_lambda1em4_120ep
      mlflow.tags.recipe: "resnet50_aig_entropy_modes_lambda1em4_1_120ep"
      mlflow.tags.initial_lambda: "0.0001"
      mlflow.tags.gate_regularization: "l1_probability"
      mlflow.tags.entropy_regularization: "plus_negative_entropy"
      mlflow.tags.repeats_per_trial: "1"
    - model.lambda_coef: 0.0001
      model.backbone.resnet_block.gate_regularization: l1_probability
      model.entropy_regularization: minus_negative_entropy
      mlflow.run_name: resnet50_aig_entropy_minus_neg_h_lambda1em4_120ep
      mlflow.tags.recipe: "resnet50_aig_entropy_modes_lambda1em4_1_120ep"
      mlflow.tags.initial_lambda: "0.0001"
      mlflow.tags.gate_regularization: "l1_probability"
      mlflow.tags.entropy_regularization: "minus_negative_entropy"
      mlflow.tags.repeats_per_trial: "1"
    - model.lambda_coef: 1.0
      model.backbone.resnet_block.gate_regularization: l1_probability
      model.entropy_regularization: disabled
      mlflow.run_name: resnet50_aig_entropy_disabled_lambda1_120ep
      mlflow.tags.recipe: "resnet50_aig_entropy_modes_lambda1em4_1_120ep"
      mlflow.tags.initial_lambda: "1"
      mlflow.tags.gate_regularization: "l1_probability"
      mlflow.tags.entropy_regularization: "disabled"
      mlflow.tags.repeats_per_trial: "1"
    - model.lambda_coef: 1.0
      model.backbone.resnet_block.gate_regularization: l1_probability
      model.entropy_regularization: plus_negative_entropy
      mlflow.run_name: resnet50_aig_entropy_plus_neg_h_lambda1_120ep
      mlflow.tags.recipe: "resnet50_aig_entropy_modes_lambda1em4_1_120ep"
      mlflow.tags.initial_lambda: "1"
      mlflow.tags.gate_regularization: "l1_probability"
      mlflow.tags.entropy_regularization: "plus_negative_entropy"
      mlflow.tags.repeats_per_trial: "1"
    - model.lambda_coef: 1.0
      model.backbone.resnet_block.gate_regularization: l1_probability
      model.entropy_regularization: minus_negative_entropy
      mlflow.run_name: resnet50_aig_entropy_minus_neg_h_lambda1_120ep
      mlflow.tags.recipe: "resnet50_aig_entropy_modes_lambda1em4_1_120ep"
      mlflow.tags.initial_lambda: "1"
      mlflow.tags.gate_regularization: "l1_probability"
      mlflow.tags.entropy_regularization: "minus_negative_entropy"
      mlflow.tags.repeats_per_trial: "1"
