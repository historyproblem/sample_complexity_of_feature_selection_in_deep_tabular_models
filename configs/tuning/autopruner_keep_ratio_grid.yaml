# @package _global_

tuning:
  enabled: true
  mode: "grid"
  study_name: "autopruner_resnet50_cifar10_keep_ratio"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 2
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 8
    threshold: 0.0
    max_attempts_per_repeat: 1
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  search_space:
    model.backbone.target_keep_ratio:
      type: categorical
      choices: [0.5, 0.3]
