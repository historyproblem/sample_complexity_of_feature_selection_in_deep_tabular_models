# @package _global_

training_arguments:
  num_epochs: 150
  adaptive_lambda:
    enabled: true
    lambda_max: null
    update_every_epochs: 2
    log_step_init: 0.23025850929940458
  batchnorm_recalibration:
    enabled: false

scheduler:
  T_max: 150

tuning:
  enabled: true
  mode: "grid"
  study_name: "resnet50_aig_adaptive_lambda_no_lambda_max_init1em4_scaled_step_150ep_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 1
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.lambda_coef: 0.0001
      training_arguments.adaptive_lambda.log_step_init: 0.23025850929940458
      mlflow.run_name: resnet50_aig_adaptive_lambda_no_lambda_max_init1em4_scaled_step_150ep_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_aig_adaptive_lambda_no_lambda_max_init1em4_scaled_step_150ep
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "0.0001"
      mlflow.tags.target_lambda: "10"
      mlflow.tags.target_growth_steps: "50"
      mlflow.tags.lambda_multiplier: "1.25892541179"
      mlflow.tags.lambda_max: "none"
      mlflow.tags.num_epochs: "150"
      mlflow.tags.update_every_epochs: "2"
      mlflow.tags.adaptive_lambda: "enabled"
