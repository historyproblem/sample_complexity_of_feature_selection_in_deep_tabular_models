# @package _global_

# Match the six-point ResNet50/CIFAR-10 sweep: dense first, then five SD runs.
# MobileNetV2 has ten eligible identity residual branches.
reporting:
  run_label_fields:
    pL: model.backbone.final_survival_probability
    lr: optimizer.lr

tuning:
  enabled: true
  mode: grid
  study_name: stochastic_depth_mobilenetv2_tinyimagenet200_pL_grid_lr003_45
  direction: maximize
  objective_metric: valid_accuracy
  n_trials: 6
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  storage: null
  load_if_exists: false
  output_dir: outputs/studies
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.backbone.final_survival_probability: 1.0
      mlflow.tags.sd_variant: pL_1.0_dense
      mlflow.run_name: stochastic_depth_mobilenetv2_tinyimagenet200_pL10_lr003_45ep_dense
      mlflow.tags.final_survival_probability: "1.0"
      mlflow.tags.expected_active_blocks: "10.0"
    - model.backbone.final_survival_probability: 0.9
      mlflow.tags.sd_variant: pL_0.9
      mlflow.run_name: stochastic_depth_mobilenetv2_tinyimagenet200_pL09_lr003_45ep
      mlflow.tags.final_survival_probability: "0.9"
      mlflow.tags.expected_active_blocks: "9.45"
    - model.backbone.final_survival_probability: 0.8
      mlflow.tags.sd_variant: pL_0.8
      mlflow.run_name: stochastic_depth_mobilenetv2_tinyimagenet200_pL08_lr003_45ep
      mlflow.tags.final_survival_probability: "0.8"
      mlflow.tags.expected_active_blocks: "8.9"
    - model.backbone.final_survival_probability: 0.7
      mlflow.tags.sd_variant: pL_0.7
      mlflow.run_name: stochastic_depth_mobilenetv2_tinyimagenet200_pL07_lr003_45ep
      mlflow.tags.final_survival_probability: "0.7"
      mlflow.tags.expected_active_blocks: "8.35"
    - model.backbone.final_survival_probability: 0.5
      mlflow.tags.sd_variant: pL_0.5
      mlflow.run_name: stochastic_depth_mobilenetv2_tinyimagenet200_pL05_lr003_45ep
      mlflow.tags.final_survival_probability: "0.5"
      mlflow.tags.expected_active_blocks: "7.25"
    - model.backbone.final_survival_probability: 0.3
      mlflow.tags.sd_variant: pL_0.3
      mlflow.run_name: stochastic_depth_mobilenetv2_tinyimagenet200_pL03_lr003_45ep
      mlflow.tags.final_survival_probability: "0.3"
      mlflow.tags.expected_active_blocks: "6.15"
