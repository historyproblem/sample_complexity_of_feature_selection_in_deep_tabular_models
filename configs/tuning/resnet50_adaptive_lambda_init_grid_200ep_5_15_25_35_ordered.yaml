# @package _global_

training_arguments:
  num_epochs: 200

scheduler:
  T_max: 200

tuning:
  enabled: true
  mode: "grid"
  study_name: "resnet50_adaptive_lambda_init_grid_200ep_5_15_25_35_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 4
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 20
    threshold: 0.4
    max_attempts_per_repeat: 3
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.lambda_coef: 5.0
      mlflow.run_name: resnet50_adaptive_lambda_init5_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_adaptive_lambda_init5
    - model.lambda_coef: 15.0
      mlflow.run_name: resnet50_adaptive_lambda_init15_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_adaptive_lambda_init15
    - model.lambda_coef: 25.0
      mlflow.run_name: resnet50_adaptive_lambda_init25_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_adaptive_lambda_init25
    - model.lambda_coef: 35.0
      mlflow.run_name: resnet50_adaptive_lambda_init35_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_adaptive_lambda_init35
