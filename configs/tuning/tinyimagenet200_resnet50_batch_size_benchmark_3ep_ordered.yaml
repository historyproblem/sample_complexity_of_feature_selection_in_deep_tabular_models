# @package _global_

training_arguments:
  num_epochs: 3
  adaptive_lambda:
    enabled: false
    baseline_history_dir: null

scheduler:
  T_max: 3

optimizer:
  gate_weight_decay_scale: null
  _target_: torch.optim.AdamW
  lr: 0.001
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.0005

tuning:
  enabled: true
  mode: "grid"
  study_name: "tinyimagenet200_resnet50_batch_size_benchmark_3ep_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 4
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 20
    threshold: 0.4
    max_attempts_per_repeat: 3
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - dataloaders.batch_size: 128
      model.lambda_coef: 10.0
      training_arguments.adaptive_lambda.enabled: false
      training_arguments.adaptive_lambda.baseline_history_dir: null
      mlflow.run_name: resnet50_gumbel_batch_benchmark_128_tinyimagenet200_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: "resnet50_gumbel_batch_size_benchmark_tinyimagenet200"
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "10"
      mlflow.tags.adaptive_lambda: "disabled"
      mlflow.tags.batch_size: "128"
      mlflow.tags.benchmark_warmup: "ignore_epoch_1"
    - dataloaders.batch_size: 160
      model.lambda_coef: 10.0
      training_arguments.adaptive_lambda.enabled: false
      training_arguments.adaptive_lambda.baseline_history_dir: null
      mlflow.run_name: resnet50_gumbel_batch_benchmark_160_tinyimagenet200_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: "resnet50_gumbel_batch_size_benchmark_tinyimagenet200"
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "10"
      mlflow.tags.adaptive_lambda: "disabled"
      mlflow.tags.batch_size: "160"
      mlflow.tags.benchmark_warmup: "ignore_epoch_1"
    - dataloaders.batch_size: 192
      model.lambda_coef: 10.0
      training_arguments.adaptive_lambda.enabled: false
      training_arguments.adaptive_lambda.baseline_history_dir: null
      mlflow.run_name: resnet50_gumbel_batch_benchmark_192_tinyimagenet200_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: "resnet50_gumbel_batch_size_benchmark_tinyimagenet200"
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "10"
      mlflow.tags.adaptive_lambda: "disabled"
      mlflow.tags.batch_size: "192"
      mlflow.tags.benchmark_warmup: "ignore_epoch_1"
    - dataloaders.batch_size: 224
      model.lambda_coef: 10.0
      training_arguments.adaptive_lambda.enabled: false
      training_arguments.adaptive_lambda.baseline_history_dir: null
      mlflow.run_name: resnet50_gumbel_batch_benchmark_224_tinyimagenet200_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: "resnet50_gumbel_batch_size_benchmark_tinyimagenet200"
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "10"
      mlflow.tags.adaptive_lambda: "disabled"
      mlflow.tags.batch_size: "224"
      mlflow.tags.benchmark_warmup: "ignore_epoch_1"
