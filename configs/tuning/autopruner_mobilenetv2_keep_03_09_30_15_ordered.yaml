# @package _global_
# Six independent 45-epoch MobileNetV2 AutoPruner runs, ordered by keep ratio.
tuning:
  enabled: true
  mode: grid
  study_name: autopruner_mobilenetv2_tinyimagenet200_30prune_15finetune_keep_03_09
  direction: maximize
  objective_metric: valid_accuracy
  n_trials: 6
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 1
    threshold: 0.0
    max_attempts_per_repeat: 1
  storage: null
  load_if_exists: false
  output_dir: outputs/studies
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.backbone.target_keep_ratio: 0.3
      mlflow.run_name: autopruner_mobilenetv2_tinyimagenet200_30_15_keep_03
      mlflow.tags.target_keep_ratio: "0.3"
    - model.backbone.target_keep_ratio: 0.5
      mlflow.run_name: autopruner_mobilenetv2_tinyimagenet200_30_15_keep_05
      mlflow.tags.target_keep_ratio: "0.5"
    - model.backbone.target_keep_ratio: 0.6
      mlflow.run_name: autopruner_mobilenetv2_tinyimagenet200_30_15_keep_06
      mlflow.tags.target_keep_ratio: "0.6"
    - model.backbone.target_keep_ratio: 0.7
      mlflow.run_name: autopruner_mobilenetv2_tinyimagenet200_30_15_keep_07
      mlflow.tags.target_keep_ratio: "0.7"
    - model.backbone.target_keep_ratio: 0.8
      mlflow.run_name: autopruner_mobilenetv2_tinyimagenet200_30_15_keep_08
      mlflow.tags.target_keep_ratio: "0.8"
    - model.backbone.target_keep_ratio: 0.9
      mlflow.run_name: autopruner_mobilenetv2_tinyimagenet200_30_15_keep_09
      mlflow.tags.target_keep_ratio: "0.9"
