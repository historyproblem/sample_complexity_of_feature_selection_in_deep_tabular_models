# @package _global_

dataloaders:
  batch_size: 128

optimizer:
  gate_weight_decay_scale: null
  _target_: torch.optim.AdamW
  lr: 0.001
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.0005

tuning:
  enabled: true
  mode: "grid"
  study_name: "tinyimagenet200_resnet50_adaptive_lambda_init001_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 1
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 20
    threshold: 0.4
    max_attempts_per_repeat: 3
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.lambda_coef: 0.01
      training_arguments.adaptive_lambda.enabled: true
      training_arguments.adaptive_lambda.update_every_epochs: 2
      training_arguments.adaptive_lambda.baseline_history_dir: outputs/baselines/resnet50_gumbel_tinyimagenet200_no_pruning_temp_${model.backbone.resnet_block.temperature}
      training_arguments.adaptive_lambda.collapse_acc_threshold: 0.01
      training_arguments.adaptive_lambda.collapse_loss_threshold: 5.3
      training_arguments.adaptive_lambda.rollback_on_degradation: true
      training_arguments.adaptive_lambda.rollback_on_collapse: true
      training_arguments.adaptive_lambda.recovery.enabled: false
      mlflow.run_name: resnet50_gumbel_adaptive_lambda_init001_tinyimagenet200_batch128_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: "resnet50_gumbel_adaptive_lambda_init001_tinyimagenet200_batch128"
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "0.01"
      mlflow.tags.adaptive_lambda: "enabled"
      mlflow.tags.batch_size: "128"
