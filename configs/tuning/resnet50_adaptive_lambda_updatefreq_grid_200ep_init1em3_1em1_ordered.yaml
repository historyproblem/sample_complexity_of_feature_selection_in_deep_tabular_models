# @package _global_

training_arguments:
  num_epochs: 200

scheduler:
  T_max: 200

tuning:
  enabled: true
  mode: "grid"
  study_name: "resnet50_adaptive_lambda_updatefreq_grid_200ep_init1em3_1em1_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 4
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 20
    threshold: 0.4
    max_attempts_per_repeat: 3
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.lambda_coef: 0.001
      training_arguments.adaptive_lambda.update_every_epochs: 2
      mlflow.run_name: resnet50_adaptive_lambda_init1em3_update2_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_adaptive_lambda_init1em3_update2
    - model.lambda_coef: 0.1
      training_arguments.adaptive_lambda.update_every_epochs: 2
      mlflow.run_name: resnet50_adaptive_lambda_init1em1_update2_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_adaptive_lambda_init1em1_update2
    - model.lambda_coef: 0.001
      training_arguments.adaptive_lambda.update_every_epochs: 1
      mlflow.run_name: resnet50_adaptive_lambda_init1em3_update1_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_adaptive_lambda_init1em3_update1
    - model.lambda_coef: 0.1
      training_arguments.adaptive_lambda.update_every_epochs: 1
      mlflow.run_name: resnet50_adaptive_lambda_init1em1_update1_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_adaptive_lambda_init1em1_update1
