# @package _global_

training_arguments:
  num_epochs: 200
  adaptive_lambda:
    enabled: true
    warmup_epochs: 0
    update_every_epochs: 2
    acc_window: 3
    lambda_min: 1e-8
    lambda_max: 10.0
    log_step_init: auto
    log_step_min: 0.04879016416943205

scheduler:
  T_max: 200

tuning:
  enabled: true
  mode: "grid"
  study_name: "resnet50_aig_regularization_ablation_200ep_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 4
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.lambda_coef: 0.000001
      model.backbone.resnet_block.gate_regularization: l1_gate
      mlflow.run_name: resnet50_aig_reg_l1_gate_200ep_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_aig_reg_l1_gate_200ep
      mlflow.tags.gate_regularization: "l1_gate"
      mlflow.tags.regularization_signal: "gate"
      mlflow.tags.regularization_norm: "l1"
      mlflow.tags.initial_lambda: "1e-6"
      mlflow.tags.target_lambda: "10"
      mlflow.tags.adaptive_lambda: "enabled"
      mlflow.tags.lambda_schedule: "1e-6_to_10_in_one_third_200ep"
    - model.lambda_coef: 0.000001
      model.backbone.resnet_block.gate_regularization: l2_gate
      mlflow.run_name: resnet50_aig_reg_l2_gate_200ep_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_aig_reg_l2_gate_200ep
      mlflow.tags.gate_regularization: "l2_gate"
      mlflow.tags.regularization_signal: "gate"
      mlflow.tags.regularization_norm: "l2"
      mlflow.tags.initial_lambda: "1e-6"
      mlflow.tags.target_lambda: "10"
      mlflow.tags.adaptive_lambda: "enabled"
      mlflow.tags.lambda_schedule: "1e-6_to_10_in_one_third_200ep"
    - model.lambda_coef: 0.000001
      model.backbone.resnet_block.gate_regularization: l1_probability
      mlflow.run_name: resnet50_aig_reg_l1_probability_200ep_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_aig_reg_l1_probability_200ep
      mlflow.tags.gate_regularization: "l1_probability"
      mlflow.tags.regularization_signal: "probability"
      mlflow.tags.regularization_norm: "l1"
      mlflow.tags.initial_lambda: "1e-6"
      mlflow.tags.target_lambda: "10"
      mlflow.tags.adaptive_lambda: "enabled"
      mlflow.tags.lambda_schedule: "1e-6_to_10_in_one_third_200ep"
    - model.lambda_coef: 0.000001
      model.backbone.resnet_block.gate_regularization: l2_probability
      mlflow.run_name: resnet50_aig_reg_l2_probability_200ep_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.recipe: resnet50_aig_reg_l2_probability_200ep
      mlflow.tags.gate_regularization: "l2_probability"
      mlflow.tags.regularization_signal: "probability"
      mlflow.tags.regularization_norm: "l2"
      mlflow.tags.initial_lambda: "1e-6"
      mlflow.tags.target_lambda: "10"
      mlflow.tags.adaptive_lambda: "enabled"
      mlflow.tags.lambda_schedule: "1e-6_to_10_in_one_third_200ep"
