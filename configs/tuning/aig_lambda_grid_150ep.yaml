# @package _global_

training_arguments:
  num_epochs: 150

tuning:
  enabled: true
  mode: "grid"
  study_name: "aig_lambda_grid_150ep"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 4
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 20
    threshold: 0.4
    max_attempts_per_repeat: 3
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  search_space:
    model.lambda_coef:
      type: categorical
      choices: [0.0, 0.01, 0.05, 0.5]
