      mlflow.tags.initial_lambda: "1e-3"
      mlflow.tags.lambda_multiplier: "1.5"
    - model.lambda_coef: 0.001
      training_arguments.adaptive_lambda.log_step_init: 0.5596157879354227
      mlflow.run_name: resnet50_adaptive_lambda_init1em3_no_boost_no_recovery_rollback5_step175_temp_${model.backbone.resnet_block.temperature}
