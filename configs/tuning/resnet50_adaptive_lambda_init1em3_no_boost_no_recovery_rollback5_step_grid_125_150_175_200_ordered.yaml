# @package _global_

training_arguments:
  num_epochs: 200

scheduler:
  T_max: 200

tuning:
  enabled: true
  mode: "grid"
  study_name: "resnet50_adaptive_lambda_init1em3_no_boost_no_recovery_rollback5_step_grid_125_150_175_200_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 4
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 20
    threshold: 0.4
    max_attempts_per_repeat: 3
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.lambda_coef: 0.001
      training_arguments.adaptive_lambda.log_step_init: 0.22314355131420976
