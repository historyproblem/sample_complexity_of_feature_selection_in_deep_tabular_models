# @package _global_

# One V100 32 GB, sequential overnight series.
# 2 author-reported keep ratios x seeds 42..45 = 8 complete runs.
# Expected wall time is roughly 7-9 hours; timeout leaves 30 minutes of the
# 11-hour allocation for startup, final export, and study summarization.

# The official ResNet-50 scripts use batch size 256, 8 workers, and pinned
# host memory. These override the repository's shared CIFAR batch size 128.
dataloaders:
  batch_size: 256
  num_workers: 8
  pin_memory: true

tuning:
  enabled: true
  mode: "grid"
  study_name: "autopruner_author_resnet50_cifar10_v100_11h"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 2
  repeats_per_trial: 4
  timeout: 37800
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 8
    threshold: 0.0
    max_attempts_per_repeat: 1
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    # These are the two ResNet-50 operating points reported by the authors.
    - model.backbone.target_keep_ratio: 0.5
      mlflow.run_name: "autopruner_resnet50_cifar10_keep_05"
      mlflow.tags.recipe: "autopruner_author_keep_05"
      mlflow.tags.target_keep_ratio: "0.5"
      mlflow.tags.author_hyperparameters: "true"
      mlflow.tags.repeats_per_ratio: "${tuning.repeats_per_trial}"
    - model.backbone.target_keep_ratio: 0.3
      mlflow.run_name: "autopruner_resnet50_cifar10_keep_03"
      mlflow.tags.recipe: "autopruner_author_keep_03"
      mlflow.tags.target_keep_ratio: "0.3"
      mlflow.tags.author_hyperparameters: "true"
      mlflow.tags.repeats_per_ratio: "${tuning.repeats_per_trial}"
