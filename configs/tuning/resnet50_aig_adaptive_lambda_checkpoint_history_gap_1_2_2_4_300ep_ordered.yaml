# @package _global_

# Two sequential 300-epoch AIG adaptive-lambda runs. The controller compares
# validation accuracy at epoch E with the dense 300-epoch baseline at epoch E.
# The baseline checkpoint identifies the reference run; its best accuracy is
# never used as a constant threshold.

training_arguments:
  num_epochs: 300
  adaptive_lambda:
    enabled: true
    baseline_history_dir: null
    baseline_checkpoint_path: outputs/baselines/resnet50_adamw_cifar10_300ep/checkpoints/best.pt
    baseline_checkpoint_history_path: outputs/baselines/resnet50_adamw_cifar10_300ep/history.csv
    lambda_max: null
    update_every_epochs: 1
    log_step_init: auto
  batchnorm_recalibration:
    enabled: false

scheduler:
  T_max: 300

tuning:
  enabled: true
  mode: "grid"
  study_name: "resnet50_aig_adaptive_lambda_checkpoint_history_gap_1_2_2_4_300ep_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 2
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.lambda_coef: 0.0001
      training_arguments.adaptive_lambda.soft_drop: 0.01
      training_arguments.adaptive_lambda.hard_drop: 0.02
      mlflow.run_name: resnet50_aig_checkpoint_history_gap_soft010_hard020_300ep
      mlflow.tags.recipe: resnet50_aig_adaptive_lambda_checkpoint_history_gap_1_2_2_4_300ep
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "0.0001"
      mlflow.tags.soft_drop: "0.01"
      mlflow.tags.hard_drop: "0.02"
      mlflow.tags.gap_pair_pp: "1.0/2.0"
      mlflow.tags.baseline_reference: "checkpoint_run_epoch_history"
      mlflow.tags.physical_pruning: "disabled"
      mlflow.tags.num_epochs: "300"
    - model.lambda_coef: 0.0001
      training_arguments.adaptive_lambda.soft_drop: 0.02
      training_arguments.adaptive_lambda.hard_drop: 0.04
      mlflow.run_name: resnet50_aig_checkpoint_history_gap_soft020_hard040_300ep
      mlflow.tags.recipe: resnet50_aig_adaptive_lambda_checkpoint_history_gap_1_2_2_4_300ep
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "0.0001"
      mlflow.tags.soft_drop: "0.02"
      mlflow.tags.hard_drop: "0.04"
      mlflow.tags.gap_pair_pp: "2.0/4.0"
      mlflow.tags.baseline_reference: "checkpoint_run_epoch_history"
      mlflow.tags.physical_pruning: "disabled"
      mlflow.tags.num_epochs: "300"
