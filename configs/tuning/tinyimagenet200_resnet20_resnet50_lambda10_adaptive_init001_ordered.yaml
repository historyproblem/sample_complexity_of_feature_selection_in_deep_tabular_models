# @package _global_

tuning:
  enabled: true
  mode: "grid"
  study_name: "tinyimagenet200_resnet20_resnet50_lambda10_adaptive_init001_ordered"
  direction: "maximize"
  objective_metric: "valid_accuracy"
  n_trials: 4
  repeats_per_trial: 1
  timeout: null
  n_jobs: 1
  seed_base: 42
  seed_stride: 1
  restart_guard:
    enabled: false
    metric: null
    mode: null
    epoch: 20
    threshold: 0.4
    max_attempts_per_repeat: 3
  storage: null
  load_if_exists: true
  output_dir: "outputs/studies"
  sampler: null
  pruner:
    _target_: optuna.pruners.NopPruner
  points_in_order: true
  points:
    - model.backbone:
        _target_: net_complexity.wrappers.CIFARResNet20
        num_classes: 200
        in_channels: 3
        resnet_block:
          _target_: net_complexity.wrappers.CIFARGumbelBasicBlock
          _partial_: true
          temperature: 1.0
          beta: 1.0
          force_ones_mask: false
          deterministic_soft_mask: false
          deterministic_hard_mask: false
          train_gate_mode: null
          eval_gate_mode: null
          gate_threshold: 0.5
      model.lambda_coef: 10.0
      model.gumbel_init_mode: auto
      model.bypass_on_zero_lambda: false
      training_arguments.num_epochs: 200
      training_arguments.lambda_warmup.enabled: false
      training_arguments.adaptive_lambda.enabled: false
      training_arguments.adaptive_lambda.baseline_history_dir: null
      scheduler.T_max: 200
      optimizer:
        gate_weight_decay_scale: null
        _target_: torch.optim.AdamW
        lr: 0.001
        betas: [0.9, 0.999]
        eps: 1e-8
        weight_decay: 0.0005
      mlflow.run_name: resnet20_gumbel_constant_lambda10_tinyimagenet200_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.model_type: "CIFARResNet20_Gumbel"
      mlflow.tags.recipe: "resnet20_gumbel_constant_lambda10_tinyimagenet200"
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "10"
      mlflow.tags.adaptive_lambda: "disabled"
    - model.backbone:
        _target_: net_complexity.wrappers.CIFARResNet20
        num_classes: 200
        in_channels: 3
        resnet_block:
          _target_: net_complexity.wrappers.CIFARGumbelBasicBlock
          _partial_: true
          temperature: 1.0
          beta: 1.0
          force_ones_mask: false
          deterministic_soft_mask: false
          deterministic_hard_mask: false
          train_gate_mode: null
          eval_gate_mode: null
          gate_threshold: 0.5
      model.lambda_coef: 0.01
      model.gumbel_init_mode: auto
      model.bypass_on_zero_lambda: false
      training_arguments.num_epochs: 200
      training_arguments.lambda_warmup.enabled: false
      training_arguments.adaptive_lambda.enabled: true
      training_arguments.adaptive_lambda.update_every_epochs: 1
      training_arguments.adaptive_lambda.baseline_history_dir: outputs/baselines/resnet20_gumbel_tinyimagenet200_no_pruning_temp_${model.backbone.resnet_block.temperature}
      training_arguments.adaptive_lambda.collapse_acc_threshold: 0.01
      training_arguments.adaptive_lambda.collapse_loss_threshold: 5.3
      training_arguments.adaptive_lambda.rollback_on_degradation: false
      training_arguments.adaptive_lambda.rollback_on_collapse: false
      training_arguments.adaptive_lambda.recovery.enabled: false
      scheduler.T_max: 200
      optimizer:
        gate_weight_decay_scale: null
        _target_: torch.optim.AdamW
        lr: 0.001
        betas: [0.9, 0.999]
        eps: 1e-8
        weight_decay: 0.0005
      mlflow.run_name: resnet20_gumbel_adaptive_lambda_init001_tinyimagenet200_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.model_type: "CIFARResNet20_Gumbel"
      mlflow.tags.recipe: "resnet20_gumbel_adaptive_lambda_init001_tinyimagenet200"
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "0.01"
      mlflow.tags.adaptive_lambda: "enabled"
    - model.backbone:
        _target_: net_complexity.wrappers.ResNet50
        num_classes: 200
        in_channels: 3
        stem_kernel_size: 3
        stem_stride: 1
        stem_padding: 1
        use_maxpool: false
        resnet_block:
          _target_: net_complexity.wrappers.GumbelBottleneckLayer
          _partial_: true
          temperature: 1.0
          beta: 1.0
          force_ones_mask: false
          deterministic_soft_mask: false
          deterministic_hard_mask: false
          train_gate_mode: null
          eval_gate_mode: null
          gate_threshold: 0.5
      model.lambda_coef: 10.0
      model.gumbel_init_mode: paper_resnet50
      model.bypass_on_zero_lambda: false
      training_arguments.num_epochs: 240
      training_arguments.lambda_warmup.enabled: false
      training_arguments.adaptive_lambda.enabled: false
      training_arguments.adaptive_lambda.baseline_history_dir: null
      scheduler.T_max: 240
      optimizer:
        gate_weight_decay_scale: null
        _target_: torch.optim.AdamW
        lr: 0.001
        betas: [0.9, 0.999]
        eps: 1e-8
        weight_decay: 0.0005
      metrics.train_metrics.2.log_channel_zero_probs: false
      metrics.valid_metrics.2.log_channel_zero_probs: false
      metrics.test_metrics.2.log_channel_zero_probs: false
      mlflow.run_name: resnet50_gumbel_constant_lambda10_tinyimagenet200_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.model_type: "ResNet50_Gumbel"
      mlflow.tags.recipe: "resnet50_gumbel_constant_lambda10_tinyimagenet200"
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "10"
      mlflow.tags.adaptive_lambda: "disabled"
    - model.backbone:
        _target_: net_complexity.wrappers.ResNet50
        num_classes: 200
        in_channels: 3
        stem_kernel_size: 3
        stem_stride: 1
        stem_padding: 1
        use_maxpool: false
        resnet_block:
          _target_: net_complexity.wrappers.GumbelBottleneckLayer
          _partial_: true
          temperature: 1.0
          beta: 1.0
          force_ones_mask: false
          deterministic_soft_mask: false
          deterministic_hard_mask: false
          train_gate_mode: null
          eval_gate_mode: null
          gate_threshold: 0.5
      model.lambda_coef: 0.01
      model.gumbel_init_mode: paper_resnet50
      model.bypass_on_zero_lambda: false
      training_arguments.num_epochs: 240
      training_arguments.lambda_warmup.enabled: false
      training_arguments.adaptive_lambda.enabled: true
      training_arguments.adaptive_lambda.update_every_epochs: 2
      training_arguments.adaptive_lambda.baseline_history_dir: outputs/baselines/resnet50_gumbel_tinyimagenet200_no_pruning_temp_${model.backbone.resnet_block.temperature}
      training_arguments.adaptive_lambda.collapse_acc_threshold: 0.01
      training_arguments.adaptive_lambda.collapse_loss_threshold: 5.3
      training_arguments.adaptive_lambda.rollback_on_degradation: true
      training_arguments.adaptive_lambda.rollback_on_collapse: true
      training_arguments.adaptive_lambda.recovery.enabled: false
      scheduler.T_max: 240
      optimizer:
        gate_weight_decay_scale: null
        _target_: torch.optim.AdamW
        lr: 0.001
        betas: [0.9, 0.999]
        eps: 1e-8
        weight_decay: 0.0005
      metrics.train_metrics.2.log_channel_zero_probs: false
      metrics.valid_metrics.2.log_channel_zero_probs: false
      metrics.test_metrics.2.log_channel_zero_probs: false
      mlflow.run_name: resnet50_gumbel_adaptive_lambda_init001_tinyimagenet200_temp_${model.backbone.resnet_block.temperature}
      mlflow.tags.model_type: "ResNet50_Gumbel"
      mlflow.tags.recipe: "resnet50_gumbel_adaptive_lambda_init001_tinyimagenet200"
      mlflow.tags.optimizer: "AdamW"
      mlflow.tags.initial_lambda: "0.01"
      mlflow.tags.adaptive_lambda: "enabled"
