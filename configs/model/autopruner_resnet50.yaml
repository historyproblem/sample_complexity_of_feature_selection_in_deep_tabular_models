# @package _global_

model:
  _target_: net_complexity.wrappers.AutoPrunerWrapper
  pretrained_checkpoint: null
  require_pretrained: true
  backbone:
    _target_: net_complexity.wrappers.AutoPrunerResNet50
    num_classes: 10
    input_size: 32
    in_channels: 3
    stage_planes: [64, 128, 256, 512]
    stem_kernel_size: 3
    stem_stride: 1
    stem_padding: 1
    use_maxpool: false
    stages_to_prune: [0, 1, 2, 3]
    leave_last_block_unpruned: true
    target_keep_ratio: 0.5
    alpha_start: 1.0
    alpha_stop: 100.0
    code_window_size: 20
