# @package _global_
#
# "Our approach", single-shot (non-iterative) block-granularity AIG gating
# with entropy regularization, pretrained family. Same gate recipe as
# ablation_mobilenetv2_tinyimagenet200/ours_non_iterative/, with this
# folder's shared pretrained setup (see plain_baseline.yaml).
#
# Launch:
#   python src/net_complexity/train.py \
#       experiment=ablation_mobilenetv2_tinyimagenet200_pretrained/ours_non_iterative/mobilenetv2_tinyimagenet200

defaults:
  - /data: tinyimagenet200_resize224_imagenet_norm
  - /model: mobilenetv2_tinyimagenet200_224_pretrained
  - /method: aig_mobilenetv2
  - /train: resnet50_best_practice
  - /optimizer: adamw_finetune
  - /scheduler: cosine_200
  - /metrics: full
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.0001
  bypass_on_zero_lambda: false
  entropy_regularization: plus_negative_entropy
  entropy_regularization_coef: 0.3
  backbone:
    block:
      temperature: 1.0
      gate_regularization: l1_probability

training_arguments:
  num_epochs: 30
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: false
  batchnorm_recalibration:
    enabled: false

scheduler:
  T_max: 30

mlflow:
  enabled: true
  experiment_name: mobilenetv2_pretrained_ours_non_iterative
  run_name: "ours_non_iterative_pretrained_mobilenetv2_tinyimagenet200_lambda${model.lambda_coef}_beta${model.entropy_regularization_coef}"
  tags:
    model_type: "MobileNetV2_AIG"
    method: "ours_non_iterative"
    dataset: "tinyimagenet200"
    init: "${model.backbone.pretrained_weights}"
    recipe: "ablation_pretrained_ours_non_iterative_mobilenetv2_tinyimagenet200"
    gate_regularization: "l1_probability"
    entropy_regularization: "plus_negative_entropy"
