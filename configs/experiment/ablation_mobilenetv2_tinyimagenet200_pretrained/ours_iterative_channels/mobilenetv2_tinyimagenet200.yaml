# @package _global_
#
# "Our approach", iterative cyclic channel pruning, pretrained family. Same
# cycle and adaptive-lambda recipe as
# ablation_mobilenetv2_tinyimagenet200/ours_iterative_channels/ (Gumbel
# search -> disable channels below g_prob_threshold -> physically pruned
# no-regularization recovery pass, every cycle), with this folder's shared
# pretrained setup (see plain_baseline.yaml).
#
# Every run of the cycle builds its model from ImageNet weights: the search
# runs load them into the full-width gated model, the recovery runs into the
# physically narrowed one (each block keeps the ImageNet values of its
# surviving channels). Weights are not carried over from one cycle's run to
# the next.
#
# Note: /metrics: full is required — the drop decision reads the
# per-channel `*.channel_NNN_zero_prob` metrics.
#
# Launch:
#   python src/net_complexity/cli/cyclic_train.py \
#       --config-name cyclic_channel_train \
#       experiment=ablation_mobilenetv2_tinyimagenet200_pretrained/ours_iterative_channels/mobilenetv2_tinyimagenet200

defaults:
  - /data: tinyimagenet200_resize224_imagenet_norm
  - /model: mobilenetv2_tinyimagenet200_224_pretrained
  - /method: gumbel_masked_mobilenetv2
  - /train: resnet50_best_practice
  - /optimizer: adamw_finetune
  - /scheduler: cosine_200
  - /metrics: full
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.0001
  bypass_on_zero_lambda: true
  entropy_regularization: plus_negative_entropy
  entropy_regularization_coef: 0.1
  backbone:
    block:
      temperature: 1.0
      # true also gates each block's internal width (expand -> depthwise ->
      # project), raising the prunable share of the model from ~20% to ~73%.
      gate_internal_width: false

training_arguments:
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: true
    warmup_epochs: 0
    update_every_epochs: 1
    acc_window: 3
    # Optional: a pretrained plain_baseline run dir; empty = this run's own
    # best validation accuracy.
    baseline_history_dir:
    lambda_min: 1e-8
    lambda_max: 100.0
    log_step_init: 0.22314355131420976
    log_step_min: 0.04879016416943205
    adaptive_log_step_enabled: true
    prune_rate_low_per_epoch: 0.02
    prune_rate_high_per_epoch: 0.07
    log_step_boost_factor: 2.0
    log_step_max_boost_level: 2
    adaptive_log_step_max_epoch: null
    soft_drop: 0.02
    hard_drop: 0.04
    recovery:
      enabled: false
  batchnorm_recalibration:
    enabled: false

cyclic_channel_pruning:
  enabled: true
  max_cycles: 10
  drop_mode: threshold
  g_prob_threshold: 0.7
  threshold_max_param_fraction: 0.2
  # Epochs per intermediate Gumbel (search) cycle.
  gumbel_epochs: 20

  # Epochs per intermediate AIG (search) cycle.
  aig_epochs: 20

  # Epochs for each intermediate no-regularization recovery pass, run after
  # every cycle's drop decision (not only at the end).
  recovery_epochs: 10

  # Epochs for the last recovery pass — the same budget as plain_baseline.
  final_epochs: 30

  disable_mlflow_for_cycles: false

mlflow:
  enabled: true
  experiment_name: mobilenetv2_pretrained_ours_iterative_channels
  run_name: "ours_iterative_channels_pretrained_mobilenetv2_tinyimagenet200_thr${cyclic_channel_pruning.g_prob_threshold}"
  tags:
    model_type: "MobileNetV2_Gumbel"
    method: "ours_iterative_channels"
    dataset: "tinyimagenet200"
    init: "${model.backbone.pretrained_weights}"
    recipe: "ablation_pretrained_ours_iterative_channels_mobilenetv2_tinyimagenet200"
    entropy_regularization: "plus_negative_entropy"

run_history:
  log_gate_history: true
