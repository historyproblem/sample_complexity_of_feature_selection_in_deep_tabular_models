# @package _global_
#
# Classic-AIG "static" baseline, pretrained family: post-hoc structural
# pruning of a trained pretrained aig_classic run (../aig_classic/), then
# fine-tuning of the static model. Same mechanics as
# ablation_mobilenetv2_tinyimagenet200/aig_classic_static/: blocks whose
# average validation gate probability is below g_prob_threshold are removed,
# the surviving gates are bypassed to always-on.
#
# The weights come from the source run's checkpoint (which itself started
# from ImageNet), so the ImageNet load at model construction is only a
# starting point that the checkpoint then overwrites.
#
# Required override before running:
#   aig_static_pruning.source_run_dir=outputs/runs/<pretrained aig_classic run for the target t>
#
# Launch:
#   python src/net_complexity/train.py \
#       experiment=ablation_mobilenetv2_tinyimagenet200_pretrained/aig_classic_static/mobilenetv2_tinyimagenet200 \
#       aig_static_pruning.source_run_dir=outputs/runs/<run>

defaults:
  - /data: tinyimagenet200_resize224_imagenet_norm
  - /model: mobilenetv2_tinyimagenet200_224_pretrained
  - /method: aig_target_rate_mobilenetv2
  - /train: resnet50_best_practice
  - /optimizer: adamw_finetune
  - /scheduler: cosine_200
  - /metrics: full
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.0
  backbone:
    block:
      temperature: 1.0

aig_static_pruning:
  enabled: true
  source_run_dir: ???
  checkpoint_name: best.pt
  g_prob_threshold: 0.5

training_arguments:
  num_epochs: 30

scheduler:
  T_max: 30

mlflow:
  enabled: true
  experiment_name: mobilenetv2_pretrained_classic_aig_static
  run_name: "aig_classic_static_pretrained_mobilenetv2_tinyimagenet200_thr${aig_static_pruning.g_prob_threshold}"
  tags:
    model_type: "MobileNetV2_AIG_Static"
    method: "aig_classic_static"
    dataset: "tinyimagenet200"
    init: "${model.backbone.pretrained_weights}"
    recipe: "ablation_pretrained_aig_classic_static_mobilenetv2_tinyimagenet200"
    g_prob_threshold: "${aig_static_pruning.g_prob_threshold}"
