# @package _global_
#
# "Our approach", iterative cyclic block pruning, pretrained family. Same
# cycle as ablation_mobilenetv2_tinyimagenet200/ours_iterative_layers/
# (AIG search with l1_probability + entropy regularization -> drop blocks
# below g_prob_threshold -> no-regularization recovery pass, every cycle),
# with this folder's shared pretrained setup (see plain_baseline.yaml).
#
# Every run of the cycle — each search and each recovery — builds its model
# from ImageNet weights; a dropped block simply disappears from it. Weights
# are not carried over from one cycle's run to the next.
#
# Launch:
#   python src/net_complexity/cli/cyclic_train.py \
#       experiment=ablation_mobilenetv2_tinyimagenet200_pretrained/ours_iterative_layers/mobilenetv2_tinyimagenet200

defaults:
  - /data: tinyimagenet200_resize224_imagenet_norm
  - /model: mobilenetv2_tinyimagenet200_224_pretrained
  - /method: aig_mobilenetv2
  - /train: resnet50_best_practice
  - /optimizer: adamw_finetune
  - /scheduler: cosine_200
  - /metrics: full
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.0001
  bypass_on_zero_lambda: false
  entropy_regularization: plus_negative_entropy
  entropy_regularization_coef: 0.3
  backbone:
    block:
      temperature: 1.0
      gate_regularization: l1_probability

training_arguments:
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: false
  batchnorm_recalibration:
    enabled: false

# Blocks pre-disabled before the first cycle (empty = full MobileNetV2).
layer_skipping:
  enabled: true
  disabled_layers: []

cyclic_layer_dropping:
  enabled: true
  max_cycles: 10
  drop_mode: threshold
  g_prob_threshold: 0.1
  threshold_max_param_fraction: 0.10

  # Epochs per intermediate AIG (search) cycle.
  aig_epochs: 20

  # Epochs for each intermediate no-regularization recovery pass, run after
  # every cycle's drop decision (not only at the end).
  recovery_epochs: 10

  # Epochs for the last recovery pass — the same budget as plain_baseline.
  final_epochs: 30

  use_plain_model_for_final: true
  disable_mlflow_for_cycles: false

mlflow:
  enabled: true
  experiment_name: mobilenetv2_pretrained_ours_iterative_layers
  run_name: "ours_iterative_layers_pretrained_mobilenetv2_tinyimagenet200_thr${cyclic_layer_dropping.g_prob_threshold}"
  tags:
    model_type: "MobileNetV2_AIG"
    method: "ours_iterative_layers"
    dataset: "tinyimagenet200"
    init: "${model.backbone.pretrained_weights}"
    recipe: "ablation_pretrained_ours_iterative_layers_mobilenetv2_tinyimagenet200"
    gate_regularization: "l1_probability"
    entropy_regularization: "plus_negative_entropy"

run_history:
  log_gate_history: true
