# @package _global_

defaults:
  - /data: cifar10_best_practice
  - /model: efficientnetv2_s_aig
  - /train: resnet50_best_practice
  - /optimizer: adamw
  - /scheduler: cosine_200
  - /metrics: aig_train_valid_flops
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

dataloaders:
  batch_size: 128
  taskname: CIFAR10

model:
  lambda_coef: 0.0001
  bypass_on_zero_lambda: false
  dropout: 0.1
  stochastic_depth: 0.0
  keep_prob_init: 0.9
  gate_threshold: 0.5
  stem_stride: 1

training_arguments:
  num_epochs: 200
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: true
    warmup_epochs: 0
    update_every_epochs: 2
    acc_window: 3
    baseline_history_dir: null
    lambda_min: 1e-8
    lambda_max: null
    log_step_init: 0.1726938819745534
    log_step_min: 0.04879016416943205
    adaptive_log_step_enabled: false
    prune_rate_low_per_epoch: 0.01
    prune_rate_high_per_epoch: 0.05
    log_step_boost_factor: 2.0
    log_step_max_boost_level: 2
    adaptive_log_step_max_epoch: null
    soft_drop: 0.02
    hard_drop: 0.04
    recovery:
      enabled: false
  batchnorm_recalibration:
    enabled: false

run_history:
  root_dir: outputs/runs
  run_name: efficientnetv2_s_aig_adaptive_lambda_init1em4_cifar10

mlflow:
  enabled: false
  run_name: efficientnetv2_s_aig_adaptive_lambda_init1em4_cifar10
  tags:
    model_type: "EfficientNetV2-S_AIG"
    method: "aig"
    recipe: "efficientnetv2_s_aig_adaptive_lambda_init1em4_cifar10"
    initial_lambda: "0.0001"
