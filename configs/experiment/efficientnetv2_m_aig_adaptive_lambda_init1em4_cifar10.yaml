# @package _global_

defaults:
  - /data: cifar10_best_practice
  - /model: efficientnetv2_m_aig
  - /train: aig_adaptive_lambda
  - /optimizer: adamw
  - /scheduler: cosine_200
  - /metrics: aig_train_valid_flops
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

dataloaders:
  batch_size: 128
  taskname: CIFAR10

model:
  lambda_coef: 0.0001
  bypass_on_zero_lambda: false
  dropout: 0.1
  stochastic_depth: 0.0
  keep_prob_init: 0.9
  gate_threshold: 0.5
  gate_temperature: 1.0
  gate_regularization: l1_probability
  stem_stride: 1

training_arguments:
  num_epochs: 200
  adaptive_lambda:
    enabled: true
    warmup_epochs: 0
    update_every_epochs: 2
    acc_window: 3
    baseline_history_dir: null
    lambda_min: 1e-8
    lambda_max: null
    log_step_init: 0.1726938819745534
    log_step_min: 0.04879016416943205
    soft_drop: 0.02
    hard_drop: 0.04
  batchnorm_recalibration:
    enabled: false

run_history:
  root_dir: outputs/runs
  run_name: efficientnetv2_m_aig_adaptive_lambda_init1em4_cifar10

mlflow:
  enabled: false
  run_name: efficientnetv2_m_aig_adaptive_lambda_init1em4_cifar10
  tags:
    model_type: "EfficientNetV2-M_AIG"
    method: "aig"
    recipe: "efficientnetv2_m_aig_adaptive_lambda_init1em4_cifar10"
    initial_lambda: "0.0001"
