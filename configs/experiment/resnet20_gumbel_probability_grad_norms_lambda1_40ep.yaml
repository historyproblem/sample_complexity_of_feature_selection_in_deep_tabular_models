# @package _global_

# Same diagnostic as lambda=0.01, with a stronger probability regularizer to
# make its gradient scale directly comparable to the CE gradient scale.
defaults:
  - /data: cifar10_best_practice
  - /model: cifar_resnet20
  - /method: gumbel
  - /train: best_practice
  - /optimizer: sgd_resnet20
  - /scheduler: cosine_200
  - /metrics: gumbel
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 1.0
  gumbel_init_mode: paper
  bypass_on_zero_lambda: false
  backbone:
    resnet_block:
      beta: 1.0
      temperature: 1.0

optimizer:
  gate_weight_decay_scale: null

scheduler:
  T_max: 40

training_arguments:
  num_epochs: 40
  gradient_norm_logging:
    enabled: true
    log_per_layer: true
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: false
  batchnorm_recalibration:
    enabled: false

run_history:
  log_channel_history: true
  log_gate_history: true

mlflow:
  enabled: true
  run_name: "resnet20_gumbel_probability_grad_norms_lambda1_40ep"
  tags:
    model_type: "CIFARResNet20_Gumbel"
    method: "gumbel_probability_l1"
    regularization: "mean_p_open"
    gradient_components: "ce,lambda_regularization,total"
    recipe: "resnet20_gumbel_probability_grad_norms_lambda1_40ep"

