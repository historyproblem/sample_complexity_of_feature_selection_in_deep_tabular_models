# @package _global_

defaults:
  - /data: cifar10
  - /model: cifar_resnet20
  - /method: gumbel
  - /train: default
  - /optimizer: adamw
  - /scheduler: none
  - /metrics: gumbel
  - /run_history: valid_loss_min
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 1.479470

mlflow:
  run_name: "gumbel_cifar_resnet20_lambda_${model.lambda_coef}"
  tags:
    model_type: "CIFARResNet20_Gumbel"
    method: "gumbel"
    recipe: "gumbel_cifar10"
