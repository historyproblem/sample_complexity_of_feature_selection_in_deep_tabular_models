# @package _global_

defaults:
  - /data: cifar10_best_practice
  - /model: resnet50
  - /method: gumbel
  - /train: resnet50_best_practice
  - /optimizer: sgd_resnet50
  - /scheduler: cosine_200
  - /metrics: gumbel_resnet50
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 35.0
  gumbel_init_mode: paper_resnet50
  bypass_on_zero_lambda: false
  backbone:
    resnet_block:
      _target_: net_complexity.wrappers.GumbelBottleneckLayer
      _partial_: true
      temperature: 1.0

training_arguments:
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: true
    warmup_epochs: 10
    update_every_epochs: 3
    acc_window: 3
    baseline_history_dir: outputs/baselines/resnet50_gumbel_cifar10_no_pruning_temp_${model.backbone.resnet_block.temperature}
    lambda_min: 1e-8
    lambda_max: 80.0
    log_step_init: 0.6931471805599453
    log_step_min: 0.04879016416943205
    soft_drop: 0.02
    hard_drop: 0.05
    soft_step_shrink: 0.5
    hard_step_shrink: 0.25
    collapse_acc_threshold: 0.15
    collapse_loss_threshold: 2.15
    collapse_zero_prob_threshold: 0.90
    collapse_acc_drop_threshold: 0.40
    rollback_on_degradation: true
    rollback_on_collapse: true
    max_rollbacks: 6
    freeze_on_rollback_limit: true

run_history:
  log_gate_history: true

mlflow:
  enabled: false
  run_name: "resnet50_adaptive_lambda_init35_temp_${model.backbone.resnet_block.temperature}"
  tags:
    model_type: "ResNet50_Gumbel"
    method: "gumbel"
    recipe: "resnet50_adaptive_lambda_init35"
