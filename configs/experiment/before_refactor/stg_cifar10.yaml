# @package _global_

defaults:
  - /data/before_refactor: cifar10
  - /model: cifar_resnet20
  - /method: stg
  - /train: default
  - /optimizer: adamw
  - /scheduler: multistep_91_136
  - /metrics: stg
  - /run_history: valid_loss_min
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 1.479470
  backbone:
    resnet_block:
      sigma: 0.5
      init_mu: 1.0

mlflow:
  run_name: "before_refactor_stg_cifar10_lambda_${model.lambda_coef}_mu_${model.backbone.resnet_block.init_mu}_sigma_${model.backbone.resnet_block.sigma}"
  tags:
    model_type: "CIFARResNet20_STG"
    method: "stg"
    recipe: "before_refactor_stg_cifar10"
