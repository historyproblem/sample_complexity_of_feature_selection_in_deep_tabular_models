# @package _global_

defaults:
  - /data/before_refactor: cifar10
  - /model: cifar_resnet20
  - /method: gumbel
  - /train: default
  - /optimizer: adamw
  - /scheduler: none
  - /metrics: gumbel
  - /run_history: valid_loss_min
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 1.479470
  gumbel_init_mode: auto
  bypass_on_zero_lambda: true
  backbone:
    resnet_block:
      beta: 1.0

mlflow:
  run_name: "before_refactor_gumbel_cifar10_lambda_${model.lambda_coef}"
  tags:
    model_type: "CIFARResNet20_Gumbel"
    method: "gumbel"
    recipe: "before_refactor_gumbel_cifar10"
