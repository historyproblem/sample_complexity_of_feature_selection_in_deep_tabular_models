# @package _global_

defaults:
  - /data: cifar10_best_practice
  - /model: resnet50
  - /method: gumbel
  - /train: resnet50_best_practice
  - /optimizer: sgd_resnet50
  - /scheduler: cosine_200
  - /metrics: gumbel_resnet50
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.0
  gumbel_init_mode: fully_open
  backbone:
    resnet_block:
      _target_: net_complexity.wrappers.GumbelBottleneckLayer
      _partial_: true
      temperature: 1.0
      beta: 1.0

training_arguments:
  lambda_warmup:
    enabled: true
    start_epoch: 30
    initial_lambda_coef: 0.0
    target_lambda_coef: 0.01
    ramp_epochs: 30
    bypass_during_warmup: false

run_history:
  log_gate_history: true

mlflow:
  enabled: false
  run_name: "best_practice_resnet50_gumbel_warmup30_ramp30_lambda_0.01_on_cifar10_temp_${model.backbone.resnet_block.temperature}"
  tags:
    model_type: "ResNet50_Gumbel"
    method: "gumbel"
    recipe: "best_practice_resnet50_gumbel_warmup30_lambda001_on_cifar10"
