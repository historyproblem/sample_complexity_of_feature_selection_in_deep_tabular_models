# @package _global_

defaults:
  - /data: cifar10_best_practice
  - /model: resnet50
  - /method: gumbel_bottleneck
  - /train: resnet50_best_practice
  - /optimizer: sgd_resnet50
  - /scheduler: cosine_200
  - /metrics: gumbel
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 20.0
  backbone:
    resnet_block:
      temperature: 1.0

mlflow:
  run_name: "gumbel_resnet50_on_cifar10_lambda_${model.lambda_coef}"
  tags:
    model_type: "ResNet50_Gumbel"
    method: "gumbel"
    recipe: "gumbel_resnet50_on_cifar10"
