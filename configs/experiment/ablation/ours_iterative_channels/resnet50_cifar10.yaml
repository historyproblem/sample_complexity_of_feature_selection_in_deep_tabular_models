# @package _global_
#
# "Our approach" — iterative cyclic pruning, channel granularity, on
# ResNet50/CIFAR10. Channel-granularity analogue of
# ablation/ours_iterative_layers: each cycle trains with per-channel Gumbel
# gates (MaskedGumbelBottleneckLayer) regularized by entropy regularization
# (this project's own contribution, extended from AIG block gates to Gumbel
# channel gates — see feature_selection.get_gumbel_posterior_regularization_terms),
# then permanently disables every channel whose validation selection
# probability falls below g_prob_threshold, then physically prunes and
# retrains the surviving architecture without regularization ("recovery
# pass") — every cycle, not only at the end. Loop repeats until convergence
# or max_cycles.
#
# Launch:
#   python src/net_complexity/cli/cyclic_train.py \
#       --config-name cyclic_channel_train \
#       experiment=ablation/ours_iterative_channels/resnet50_cifar10

defaults:
  - /data: cifar10_best_practice
  - /model: resnet50
  - /method: gumbel_masked_bottleneck
  - /train: resnet50_best_practice
  - /optimizer: adamw
  - /scheduler: cosine_200
  - /metrics: full
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.0001
  bypass_on_zero_lambda: true
  entropy_regularization: plus_negative_entropy
  entropy_regularization_coef: 0.3
  backbone:
    resnet_block:
      temperature: 1.0

training_arguments:
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: false
  batchnorm_recalibration:
    enabled: false

cyclic_channel_pruning:
  enabled: true
  max_cycles: 10
  drop_mode: threshold
  g_prob_threshold: 0.1
  threshold_max_param_fraction: 0.10

  # Epochs per intermediate Gumbel (search) cycle.
  gumbel_epochs: 60

  # Epochs for each intermediate no-regularization, structurally-pruned
  # recovery pass, run after every cycle's drop decision.
  recovery_epochs: 20

  # Epochs for the last recovery pass (falls back to recovery_epochs if unset).
  final_epochs: 150

  disable_mlflow_for_cycles: false

mlflow:
  enabled: true
  experiment_name: feature_selection_experiment
  run_name: "ablation_ours_iterative_channels_resnet50_cifar10_thr${cyclic_channel_pruning.g_prob_threshold}"
  tags:
    model_type: "ResNet50_Gumbel"
    method: "ours_iterative_channels"
    dataset: "cifar10"
    recipe: "ablation_ours_iterative_channels_resnet50_cifar10"
    entropy_regularization: "plus_negative_entropy"

run_history:
  log_gate_history: true
