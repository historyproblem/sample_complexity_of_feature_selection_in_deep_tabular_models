# @package _global_
#
# DepGraph baseline on ResNet101/CIFAR10 — group-L2-norm importance by
# default. Override depgraph_pruning.importance for the other approaches
# (magnitude_l1 | random | bn_scale), matching the resnet50_cifar10 variants.
# Required override: depgraph_pruning.source_run_dir=<plain baseline run dir>

defaults:
  - /data: cifar10_best_practice
  - /model: resnet101
  - /method: plain
  - /train: resnet50_best_practice
  - /optimizer: adamw
  - /scheduler: cosine_200
  - /metrics: full
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.0

depgraph_pruning:
  enabled: true
  source_checkpoint: null
  source_run_dir: ???
  checkpoint_name: best.pt
  importance: magnitude_l2
  sparsity_learning: false
  target_speedup: 2.0
  global_pruning: true
  iterative_steps: 200
  example_input_size: [3, 32, 32]
  random_seed: 42

mlflow:
  enabled: true
  experiment_name: feature_selection_experiment
  run_name: "ablation_depgraph_resnet101_cifar10_${depgraph_pruning.importance}_speedup${depgraph_pruning.target_speedup}"
  tags:
    model_type: "ResNet101_DepGraph"
    method: "depgraph"
    dataset: "cifar10"
    recipe: "ablation_depgraph_resnet101_cifar10"
    importance: "${depgraph_pruning.importance}"
    sparsity_learning: "false"
    target_speedup: "${depgraph_pruning.target_speedup}"
