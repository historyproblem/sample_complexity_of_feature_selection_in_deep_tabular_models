# @package _global_
#
# "Our approach" — iterative cyclic pruning, block/layer granularity, on
# ResNet50/CIFAR10. Each cycle trains with AIG gates regularized by
# l1_probability + entropy regularization (this project's own contribution,
# see feature/aig-entropy-regularization), then permanently drops every
# residual block whose validation gate probability falls below
# g_prob_threshold, then retrains the surviving architecture without
# regularization ("recovery pass") — every cycle, not only at the end.
# Loop repeats until convergence or max_cycles.
#
# Launch:
#   python src/net_complexity/cli/cyclic_train.py \
#       experiment=ablation/ours_iterative_layers/resnet50_cifar10

defaults:
  - /data: cifar10_best_practice
  - /model: resnet50
  - /method: aig
  - /train: resnet50_best_practice
  - /optimizer: adamw
  - /scheduler: cosine_200
  - /metrics: full
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.0001
  bypass_on_zero_lambda: false
  entropy_regularization: plus_negative_entropy
  entropy_regularization_coef: 0.3
  backbone:
    resnet_block:
      temperature: 1.0
      gate_regularization: l1_probability

training_arguments:
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: false
  batchnorm_recalibration:
    enabled: false

# Blocks pre-disabled before the first cycle (empty = full ResNet50).
layer_skipping:
  enabled: true
  disabled_layers: []

cyclic_layer_dropping:
  enabled: true
  max_cycles: 10
  drop_mode: threshold
  g_prob_threshold: 0.1
  max_param_fraction: 0.10

  # Epochs per intermediate AIG (search) cycle.
  aig_epochs: 100

  # Epochs for each intermediate no-regularization recovery pass, run after
  # every cycle's drop decision (not only at the end).
  recovery_epochs: 30

  # Epochs for the last recovery pass (falls back to recovery_epochs if unset).
  final_epochs: 150

  use_plain_model_for_final: true
  disable_mlflow_for_cycles: false

mlflow:
  enabled: true
  experiment_name: feature_selection_experiment
  run_name: "ablation_ours_iterative_layers_resnet50_cifar10_thr${cyclic_layer_dropping.g_prob_threshold}"
  tags:
    model_type: "ResNet50_AIG"
    method: "ours_iterative_layers"
    dataset: "cifar10"
    recipe: "ablation_ours_iterative_layers_resnet50_cifar10"
    gate_regularization: "l1_probability"
    entropy_regularization: "plus_negative_entropy"

run_history:
  log_gate_history: true
