defaults:
  - /data: cifar10_best_practice
  - /model: cifar_resnet20
  - /method: gumbel
  - /train: best_practice
  - /optimizer: sgd_resnet20
  - /scheduler: multistep_91_136
  - /metrics: gumbel
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

seed: 42

model:
  lambda_coef: 0.0
  # backbone:
  # resnet_block:
  #   sigma: 0.5
  #   init_mu: 1.0


mlflow:
  run_name: "gumbel_cifar10_lambda_${model.lambda_coef}_1"
  tags:
    model_type: "CIFARResNet20_Gumbel"
    method: "gumbel"
    recipe: "gumbel_cifar10"