# @package _global_
# AutoPruner adaptation for MobileNetV2/TinyImageNet-200, initialized from
# the validation-selected plain MobileNetV2 checkpoint. Fifteen epochs search
# all internal expansion widths, followed by 30 epochs of fine-tuning.
defaults:
  - /data: tinyimagenet200_resize224_imagenet_norm
  - /optimizer: sgd_autopruner_author
  - /scheduler: none
  - /metrics: autopruner
  - /run_history: autopruner_valid_accuracy_max
  - /tracking: default
  - _self_

device: cuda:0
seed: 42

model:
  _target_: net_complexity.wrappers.AutoPrunerWrapper
  pretrained_checkpoint: ???
  require_pretrained: true
  pruning_epochs_per_stage: 15
  final_fine_tune_epochs: 30
  backbone:
    _target_: net_complexity.wrappers.AutoPrunerMobileNetV2
    num_classes: 200
    in_channels: 3
    width_mult: 1.0
    input_size: 224
    stem_stride: 2
    dropout: 0.2
    target_keep_ratio: 0.5

training_arguments:
  num_epochs: 45
  lambda_warmup:
    enabled: false
  # AutoPruner uses its own per-window adaptive regularization coefficient.
  adaptive_lambda:
    enabled: false
  batchnorm_recalibration:
    enabled: false
  collapse_guard:
    enabled: false

run_history:
  min_epoch: 16

mlflow:
  enabled: true
  experiment_name: mobilenetv2_pretrained_autopruner
  run_name: autopruner_mobilenetv2_tinyimagenet200_45ep_keep05
  tags:
    model_type: MobileNetV2_AutoPruner
    method: autopruner
    dataset: tinyimagenet200
    recipe: autopruner_mobilenetv2_tinyimagenet200_45ep
