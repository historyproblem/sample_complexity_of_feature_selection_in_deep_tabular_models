device: "cuda:0"

dataloaders:
  _target_: net_complexity.dataloaders.ClassicCVDataloaders
  path_to_data: ${hydra:runtime.cwd}/data
  train_val_ratio: [0.9, 0.1]
  batch_size: 128
  taskname: CIFAR10

model:
  _target_: net_complexity.wrappers.ClassificationFeatureSelectionWrapper
  backbone:
    _target_: net_complexity.wrappers.CIFARResNet20
    num_classes: 10
    in_channels: 3
    resnet_block:
      _target_: net_complexity.wrappers.CIFARGumbelBasicBlock
      _partial_: true
  lambda_coef: 0.0
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  regularization_loss:
    _target_: net_complexity.wrappers.get_gumbel_loss
    _partial_: true

training_arguments:
  num_epochs: 250
  early_stopping:
    enabled: true
    patience: 40
    min_epochs: 150
    min_delta: 0.0
  collapse_guard:
    enabled: false
    min_epoch: 35
    patience: 20
    min_epochs_since_best: 20
    acc_threshold_abs: 0.15
    acc_threshold_rel: 0.30
    loss_threshold: 2.25
    zero_threshold: 0.86

run_history:
  root_dir: outputs/runs
  monitor: valid_accuracy
  mode: max

metrics:
  _target_: net_complexity.meta.Metrics
  train_metrics:
    - _target_: net_complexity.metrics.base.MultiLossMetric
    - _target_: net_complexity.metrics.classification.Accuracy
    - _target_: net_complexity.metrics.gumbel.GumbelProbMetric
  valid_metrics:
    - _target_: net_complexity.metrics.base.MultiLossMetric
    - _target_: net_complexity.metrics.classification.Accuracy
    - _target_: net_complexity.metrics.gumbel.GumbelProbMetric
  test_metrics:
    - _target_: net_complexity.metrics.base.MultiLossMetric
    - _target_: net_complexity.metrics.classification.Accuracy
    - _target_: net_complexity.metrics.gumbel.GumbelProbMetric

optimizer:
  _target_: torch.optim.SGD
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0001
  nesterov: false

scheduler:
  _target_: torch.optim.lr_scheduler.MultiStepLR
  milestones: [91, 136]
  gamma: 0.1

mlflow:
  tracking_uri: null
  experiment_name: "feature_selection_experiment"
  run_name: "best_practice_resnet20_on_cifar10_lambda0"
  log_model: true
  log_artifacts: true
  artifacts_dir: "./mlruns"
  tags:
    project: "net_complexity"
    model_type: "CIFARResNet20_Gumbel"
    recipe: "resnet20_cifar10_paper_sgd_lambda0"
