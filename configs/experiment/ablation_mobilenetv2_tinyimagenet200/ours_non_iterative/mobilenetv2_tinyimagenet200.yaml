# @package _global_
#
# "Our approach" — single-shot (non-iterative) block-granularity AIG gating
# with entropy regularization, on MobileNetV2/TinyImageNet200. Same gate
# recipe as ours_iterative_layers but trained once, with no cyclic
# drop/recovery loop — the direct counterpart of aig_classic (same
# architecture, different regularizer).
#
# Launch:
#   python src/net_complexity/train.py \
#       experiment=ablation_mobilenetv2_tinyimagenet200/ours_non_iterative/mobilenetv2_tinyimagenet200

defaults:
  - /data: tinyimagenet200_best_practice
  - /model: mobilenetv2_tinyimagenet200
  - /method: aig_mobilenetv2
  - /train: resnet50_best_practice
  - /optimizer: adamw
  - /scheduler: cosine_200
  - /metrics: full
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.0001
  bypass_on_zero_lambda: false
  entropy_regularization: plus_negative_entropy
  entropy_regularization_coef: 0.3
  backbone:
    block:
      temperature: 1.0
      gate_regularization: l1_probability

training_arguments:
  num_epochs: 200
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: false
  batchnorm_recalibration:
    enabled: false

scheduler:
  T_max: 200

mlflow:
  enabled: true
  experiment_name: feature_selection_experiment
  run_name: "ablation_ours_non_iterative_mobilenetv2_tinyimagenet200_lambda${model.lambda_coef}_beta${model.entropy_regularization_coef}"
  tags:
    model_type: "MobileNetV2_AIG"
    method: "ours_non_iterative"
    dataset: "tinyimagenet200"
    recipe: "ablation_ours_non_iterative_mobilenetv2_tinyimagenet200"
    gate_regularization: "l1_probability"
    entropy_regularization: "plus_negative_entropy"
