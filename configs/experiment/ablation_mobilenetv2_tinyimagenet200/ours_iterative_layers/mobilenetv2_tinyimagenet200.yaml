# @package _global_
#
# "Our approach" — iterative cyclic pruning, block granularity, on
# MobileNetV2/TinyImageNet200. Each cycle trains with AIG gates regularized
# by l1_probability + entropy regularization, then permanently drops every
# gated block whose validation gate probability falls below
# g_prob_threshold, then retrains the surviving architecture without
# regularization ("recovery pass") — every cycle, not only at the end.
#
# Block addressing is `features.N` (the index inside MobileNetV2.features).
# Only blocks with a skip connection are gated and droppable — for the stock
# MobileNetV2 table that is 10 of the 17 inverted-residual blocks — and a
# dropped one collapses to a parameter-free identity.
#
# Optional: point adaptive_lambda.baseline_history_dir at a plain_baseline
# run and flip adaptive_lambda.enabled to true to tune lambda against that
# baseline's per-epoch accuracy instead of holding it constant.
#
# Launch:
#   python src/net_complexity/cli/cyclic_train.py \
#       experiment=ablation_mobilenetv2_tinyimagenet200/ours_iterative_layers/mobilenetv2_tinyimagenet200

defaults:
  - /data: tinyimagenet200_best_practice
  - /model: mobilenetv2_tinyimagenet200
  - /method: aig_mobilenetv2
  - /train: resnet50_best_practice
  - /optimizer: adamw
  - /scheduler: cosine_200
  - /metrics: full
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.0001
  bypass_on_zero_lambda: false
  entropy_regularization: plus_negative_entropy
  entropy_regularization_coef: 0.3
  backbone:
    block:
      temperature: 1.0
      gate_regularization: l1_probability

training_arguments:
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: false
  batchnorm_recalibration:
    enabled: false

# Blocks pre-disabled before the first cycle (empty = full MobileNetV2).
layer_skipping:
  enabled: true
  disabled_layers: []

cyclic_layer_dropping:
  enabled: true
  max_cycles: 10
  drop_mode: threshold
  g_prob_threshold: 0.1
  threshold_max_param_fraction: 0.10

  # Epochs per intermediate AIG (search) cycle.
  aig_epochs: 100

  # Epochs for each intermediate no-regularization recovery pass, run after
  # every cycle's drop decision (not only at the end).
  recovery_epochs: 30

  # Epochs for the last recovery pass (falls back to recovery_epochs if unset).
  final_epochs: 150

  use_plain_model_for_final: true
  disable_mlflow_for_cycles: false

mlflow:
  enabled: true
  experiment_name: feature_selection_experiment
  run_name: "ablation_ours_iterative_layers_mobilenetv2_tinyimagenet200_thr${cyclic_layer_dropping.g_prob_threshold}"
  tags:
    model_type: "MobileNetV2_AIG"
    method: "ours_iterative_layers"
    dataset: "tinyimagenet200"
    recipe: "ablation_ours_iterative_layers_mobilenetv2_tinyimagenet200"
    gate_regularization: "l1_probability"
    entropy_regularization: "plus_negative_entropy"

run_history:
  log_gate_history: true
