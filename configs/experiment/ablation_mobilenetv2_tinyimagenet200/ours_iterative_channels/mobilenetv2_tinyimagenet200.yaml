# @package _global_
#
# "Our approach" — iterative cyclic pruning, channel granularity, on
# MobileNetV2/TinyImageNet200. Each cycle trains with per-channel Gumbel
# gates (MaskedGumbelInvertedResidual) regularized by entropy
# regularization, then permanently disables every channel whose validation
# selection probability falls below g_prob_threshold, then physically prunes
# and retrains the surviving architecture without regularization ("recovery
# pass") — every cycle, not only at the end.
#
# The gate sits on the block's residual-branch output (the `project` conv's
# output, before the skip sum), so a disabled channel becomes pure identity —
# the same semantics the Bottleneck variant gets from gating conv3. Only
# blocks with a skip connection are gated (10 of 17 for the stock table).
# The inverted bottleneck's internal width (expand -> depthwise) is not
# narrowed: there is no gate_internal_width analogue here.
#
# Note: /metrics: full is required — cyclic_channel_pruning drives its drop
# decision off the per-channel `*.channel_NNN_zero_prob` metrics that
# log_channel_zero_probs: true produces.
#
# Launch:
#   python src/net_complexity/cli/cyclic_train.py \
#       --config-name cyclic_channel_train \
#       experiment=ablation_mobilenetv2_tinyimagenet200/ours_iterative_channels/mobilenetv2_tinyimagenet200

defaults:
  - /data: tinyimagenet200_best_practice
  - /model: mobilenetv2_tinyimagenet200
  - /method: gumbel_masked_mobilenetv2
  - /train: resnet50_best_practice
  - /optimizer: adamw
  - /scheduler: cosine_200
  - /metrics: full
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.0001
  bypass_on_zero_lambda: true
  entropy_regularization: plus_negative_entropy
  entropy_regularization_coef: 0.1
  backbone:
    block:
      temperature: 1.0

training_arguments:
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: true
    warmup_epochs: 0
    update_every_epochs: 1
    acc_window: 3
    baseline_history_dir: 
    lambda_min: 1e-8
    lambda_max: 100.0
    log_step_init: 0.22314355131420976
    log_step_min: 0.04879016416943205
    adaptive_log_step_enabled: true
    prune_rate_low_per_epoch: 0.02
    prune_rate_high_per_epoch: 0.07
    log_step_boost_factor: 2.0
    log_step_max_boost_level: 2
    adaptive_log_step_max_epoch: null
    soft_drop: 0.02
    hard_drop: 0.04
    recovery:
      enabled: false
  batchnorm_recalibration:
    enabled: false

cyclic_channel_pruning:
  enabled: true
  max_cycles: 10
  drop_mode: threshold
  g_prob_threshold: 0.7
  threshold_max_param_fraction: 0.2
  # Epochs per intermediate Gumbel (search) cycle.
  gumbel_epochs: 120

  # Epochs per intermediate AIG (search) cycle.
  aig_epochs: 120

  # Epochs for each intermediate no-regularization recovery pass, run after
  # every cycle's drop decision (not only at the end).
  recovery_epochs: 150

  # Epochs for the last recovery pass (falls back to recovery_epochs if unset).
  final_epochs: 150

  disable_mlflow_for_cycles: false

mlflow:
  enabled: true
  experiment_name: mobilenetv2_iterative_channel_pruning_entropy_threshold_max_param_fraction_0.2
  run_name: "ours_iterative_channels_mobilenetv2_tinyimagenet200_thr${cyclic_channel_pruning.g_prob_threshold}"
  tags:
    model_type: "MobileNetV2_Gumbel"
    method: "ours_iterative_channels"
    dataset: "tinyimagenet200"
    recipe: "ablation_ours_iterative_channels_mobilenetv2_tinyimagenet200"
    entropy_regularization: "plus_negative_entropy"

run_history:
  log_gate_history: true
