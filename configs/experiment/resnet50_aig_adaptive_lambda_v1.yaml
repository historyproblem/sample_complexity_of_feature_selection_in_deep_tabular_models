# @package _global_

defaults:
  - /data: cifar10_best_practice
  - /model: resnet50
  - /method: aig
  - /train: resnet50_best_practice
  - /optimizer: adamw
  - /scheduler: cosine_200
  - /metrics: aig
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.01
  bypass_on_zero_lambda: false
  backbone:
    resnet_block:
      temperature: 1.0

training_arguments:
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: true
    warmup_epochs: 0
    update_every_epochs: 2
    acc_window: 3
    baseline_history_dir: outputs/baselines/resnet50_aig_cifar10_no_pruning_temp_${model.backbone.resnet_block.temperature}
    lambda_min: 1e-8
    lambda_max: 1.0
    log_step_init: 0.22314355131420976
    log_step_min: 0.04879016416943205
    adaptive_log_step_enabled: true
    prune_rate_low_per_epoch: 0.02
    prune_rate_high_per_epoch: 0.07
    log_step_boost_factor: 2.0
    log_step_max_boost_level: 2
    adaptive_log_step_max_epoch: null
    soft_drop: 0.02
    hard_drop: 0.04
    recovery:
      enabled: false
  batchnorm_recalibration:
    enabled: false

mlflow:
  enabled: false
  run_name: "resnet50_aig_adaptive_lambda_v1_temp_${model.backbone.resnet_block.temperature}"
  tags:
    model_type: "ResNet50_AIG"
    method: "aig"
    recipe: "resnet50_aig_adaptive_lambda_v1"
