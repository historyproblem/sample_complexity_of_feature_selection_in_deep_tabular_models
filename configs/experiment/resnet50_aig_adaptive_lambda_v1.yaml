# @package _global_

defaults:
  - /data: cifar10_best_practice
  - /model: resnet50
  - /method: aig
  - /train: aig_adaptive_lambda
  - /optimizer: adamw
  - /scheduler: cosine_200
  - /metrics: aig
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.000001
  bypass_on_zero_lambda: false
  backbone:
    resnet_block:
      temperature: 1.0
      gate_regularization: l2_gate

training_arguments:
  adaptive_lambda:
    enabled: true
    warmup_epochs: 0
    update_every_epochs: 2
    acc_window: 3
    baseline_history_dir: outputs/baselines/resnet50_aig_cifar10_no_pruning_temp_${model.backbone.resnet_block.temperature}
    lambda_min: 1e-8
    lambda_max: 10.0
    log_step_init: auto
    log_step_min: 0.04879016416943205
    soft_drop: 0.02
    hard_drop: 0.04
  batchnorm_recalibration:
    enabled: false

mlflow:
  enabled: false
  run_name: "resnet50_aig_adaptive_lambda_v1_temp_${model.backbone.resnet_block.temperature}"
  tags:
    model_type: "ResNet50_AIG"
    method: "aig"
    recipe: "resnet50_aig_adaptive_lambda_v1"
    gate_regularization: "l2_gate"
    initial_lambda: "1e-6"
    target_lambda: "10"
