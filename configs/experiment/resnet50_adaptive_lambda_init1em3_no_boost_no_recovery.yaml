# @package _global_

defaults:
  - /data: cifar10_best_practice
  - /model: resnet50
  - /method: gumbel
  - /train: resnet50_best_practice
  - /optimizer: sgd_resnet50
  - /scheduler: cosine_200
  - /metrics: gumbel_resnet50
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

model:
  lambda_coef: 0.001
  gumbel_init_mode: paper_resnet50
  bypass_on_zero_lambda: false
  backbone:
    resnet_block:
      _target_: net_complexity.wrappers.GumbelBottleneckLayer
      _partial_: true
      temperature: 1.0
      beta: 1.0

training_arguments:
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: true
    warmup_epochs: 0
    update_every_epochs: 1
    acc_window: 3
    baseline_history_dir: outputs/baselines/resnet50_gumbel_cifar10_no_pruning_temp_${model.backbone.resnet_block.temperature}
    lambda_min: 1e-8
    lambda_max: 100.0
    log_step_init: 0.22314355131420976
    log_step_min: 0.04879016416943205
    adaptive_log_step_enabled: false
    soft_drop: 0.02
    hard_drop: 0.04
    recovery:
      enabled: false

run_history:
  log_gate_history: true

mlflow:
  enabled: false
  run_name: "resnet50_adaptive_lambda_init1em3_no_boost_no_recovery_step125_temp_${model.backbone.resnet_block.temperature}"
  tags:
    model_type: "ResNet50_Gumbel"
    method: "gumbel"
    recipe: "resnet50_adaptive_lambda_init1em3_no_boost_no_recovery_step125"
