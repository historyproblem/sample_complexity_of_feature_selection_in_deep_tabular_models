# @package _global_

defaults:
  - /data: tinyimagenet200_best_practice
  - /model: resnet50_tinyimagenet200
  - /method: gumbel
  - /train: resnet50_best_practice
  - /optimizer: sgd_resnet50
  - /scheduler: cosine_200
  - /metrics: gumbel_resnet50
  - /run_history: valid_accuracy_max
  - /tracking: default
  - _self_

device: "cuda:0"

training_arguments:
  num_epochs: 240
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: true
    warmup_epochs: 0
    update_every_epochs: 2
    acc_window: 3
    baseline_history_dir: outputs/baselines/resnet50_gumbel_tinyimagenet200_no_pruning_temp_${model.backbone.resnet_block.temperature}
    lambda_min: 1e-8
    lambda_max: 100.0
    log_step_init: 0.22314355131420976
    log_step_min: 0.04879016416943205
    adaptive_log_step_enabled: true
    prune_rate_low_per_epoch: 0.02
    prune_rate_high_per_epoch: 0.07
    log_step_boost_factor: 2.0
    log_step_max_boost_level: 2
    adaptive_log_step_max_epoch: null
    soft_drop: 0.02
    hard_drop: 0.04
    soft_step_shrink: 0.5
    hard_step_shrink: 0.25
    collapse_acc_threshold: 0.01
    collapse_loss_threshold: 5.3
    collapse_zero_prob_threshold: 0.90
    collapse_acc_drop_threshold: 0.40
    rollback_check_every_epochs: 1
    rollback_acc_drop_threshold: 0.20
    rollback_epoch_lookback: 20
    lambda_increase_cooldown_epochs: 10
    rollback_on_degradation: true
    rollback_on_collapse: true
    max_rollbacks: 6
    freeze_on_rollback_limit: true
    recovery:
      enabled: false

scheduler:
  T_max: 240

model:
  lambda_coef: 10.0
  gumbel_init_mode: paper_resnet50
  bypass_on_zero_lambda: false
  backbone:
    resnet_block:
      _target_: net_complexity.wrappers.GumbelBottleneckLayer
      _partial_: true
      temperature: 1.0
      beta: 1.0

run_history:
  log_gate_history: true

mlflow:
  enabled: false
  run_name: "resnet50_gumbel_adaptive_lambda_tinyimagenet200_v1_temp_${model.backbone.resnet_block.temperature}"
  tags:
    model_type: "ResNet50_Gumbel"
    method: "gumbel"
    dataset: "tinyimagenet200"
    recipe: "resnet50_gumbel_adaptive_lambda_tinyimagenet200_v1"
