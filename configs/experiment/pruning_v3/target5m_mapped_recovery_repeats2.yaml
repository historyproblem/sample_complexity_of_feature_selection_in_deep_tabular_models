# @package _global_
# One adaptive search (or an explicitly reused completed search), followed by
# two physical recoveries with mapped AdamW state and independent fresh cosine
# schedulers. Repeat seeds affect recovery only; the shared search remains seed42.
defaults:
  - /accuracy_guided_gates_v3
  - _self_

one_shot:
  protocol: pruning_v3_mapped_optimizer_fresh_scheduler_repeats2_60_90
  search_epochs: 60
  final_epochs: 90
  search_scheduler_horizon_epochs: 60
  search_scheduler_eta_min: 0.00066443
  execution_order: repeat_major
  methods:
    - id: mapped_optimizer_fresh_scheduler
      model_state: selected_surviving_state
      optimizer_state: mapped_adamw_moments_and_step
      scheduler_state: fresh_final_stage_cosine
  repeats:
    - {id: repeat_1, training_seed: 42}
    - {id: repeat_2, training_seed: 43}

dataloaders:
  download_progress: true

accuracy_guided:
  eligibility:
    min_keep_ratio: 0.14
  guard:
    train_bn_calibration_batches: 0
  stage_plan:
    - {id: shared_search, kind: search, epochs: 60, commit_allowed: false, selected_checkpoint: null, restart_policy: adamw_cosine_restart}
    - {id: export_only, kind: commit, epochs: 0, commit_allowed: true, selected_checkpoint: null, restart_policy: none}
    - {id: final_recovery, kind: recovery, epochs: 90, commit_allowed: false, selected_checkpoint: null, restart_policy: branch_specific_optimizer_scheduler_handoff}

training_arguments:
  adaptive_lambda:
    soft_drop: 0.010
    hard_drop: 0.015
    update_every_search_epochs: 1
    log_step: 0.6931471805599453

mlflow:
  run_name: target5m_mapped_recovery_repeats2
run_history:
  run_name: target5m_mapped_recovery_repeats2
