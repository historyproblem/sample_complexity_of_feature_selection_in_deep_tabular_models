# @package _global_
defaults:
  - /experiment/pruning_v3/epoch_split_recovery_base
  - _self_

one_shot:
  search_epochs: 75
  final_epochs: 75
  search_scheduler_horizon_epochs: 75

accuracy_guided:
  stage_plan:
    - {id: shared_search, kind: search, epochs: 75, commit_allowed: false, selected_checkpoint: null, restart_policy: adamw_cosine_restart}
    - {id: export_only, kind: commit, epochs: 0, commit_allowed: true, selected_checkpoint: null, restart_policy: none}
    - {id: final_recovery, kind: recovery, epochs: 75, commit_allowed: false, selected_checkpoint: null, restart_policy: branch_specific_optimizer_scheduler_handoff}

training_arguments:
  adaptive_lambda:
    soft_drop: 0.0004
    hard_drop: 0.0008

mlflow:
  run_name: epoch_split_75_75_recovery

run_history:
  run_name: epoch_split_75_75_recovery
