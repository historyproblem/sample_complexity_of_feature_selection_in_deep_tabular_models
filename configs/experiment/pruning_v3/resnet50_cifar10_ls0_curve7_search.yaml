# @package _global_
defaults:
  - /experiment/pruning_v3/epoch_split_auto_60_90_search
  - _self_

# Plain CrossEntropyLoss has label_smoothing=0. Keep the canonical mapping to
# remain compatible with the saved dense-reference criterion; the study runner
# explicitly rejects nonzero smoothing in either phase and when resuming.
model:
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  entropy_regularization_coef: 0.0
  backbone:
    resnet_block:
      gate_threshold: 0.5
      gate_internal_width: true
      gate_output: false

accuracy_guided:
  drop_mode: learned_closed_gates
  eligibility:
    min_keep_ratio: 0.001

mlflow:
  run_name: resnet50_cifar10_ls0_curve7_search
run_history:
  run_name: resnet50_cifar10_ls0_curve7_search
