# @package _global_
# MobileNetV2/TinyImageNet-200 recovery half of one independently searched
# point. It must reuse that point's completed search/export and trains exactly
# one inherited physical model for 90 epochs with fresh AdamW/fresh cosine.
defaults:
  - /accuracy_guided_gates_v3_mobilenetv2_tinyimagenet200
  - _self_

one_shot:
  protocol: pruning_v3_quality_recovery_single_60_90
  search_epochs: 60
  final_epochs: 90
  reuse_search_required: true
  search_scheduler_horizon_epochs: 60
  search_scheduler_eta_min: 0.0
  execution_order: single
  methods:
    - id: fresh_optimizer_fresh_scheduler
      model_state: selected_surviving_state
      optimizer_state: fresh
      scheduler_state: fresh_final_stage_cosine
  repeats:
    - {id: repeat_1, training_seed: 42}

model:
  criterion:
    label_smoothing: 0.05

optimizer:
  lr: 0.001

scheduler:
  eta_min: 0.0

accuracy_guided:
  eligibility:
    min_keep_ratio: 0.08
  guard:
    train_bn_calibration_batches: 0
  stage_plan:
    - {id: shared_search, kind: search, epochs: 60, commit_allowed: false, selected_checkpoint: null, restart_policy: adamw_cosine_restart}
    - {id: export_only, kind: commit, epochs: 0, commit_allowed: true, selected_checkpoint: null, restart_policy: none}
    - {id: final_recovery, kind: recovery, epochs: 90, commit_allowed: false, selected_checkpoint: null, restart_policy: branch_specific_optimizer_scheduler_handoff}

training_arguments:
  adaptive_lambda:
    enabled: true
    soft_drop: 0.005
    hard_drop: 0.010
    update_every_search_epochs: 1
    log_step: auto

mlflow:
  run_name: mobilenetv2_tinyimagenet200_parameter_curve_recovery90

run_history:
  run_name: mobilenetv2_tinyimagenet200_parameter_curve_recovery90
