# @package _global_
# One shared search and one selected compact architecture. Every physical branch
# inherits identical model/BN state; only optimizer/scheduler state changes.
# Execution is repeat-major: all three methods finish once before repeat 2 starts.
defaults:
  - /accuracy_guided_gates_v3
  - _self_

one_shot:
  protocol: pruning_v3_optimizer_scheduler_handoff_60_90
  search_epochs: 60
  final_epochs: 90

  # The continued scheduler must never inherit a 60-epoch cosine that has
  # already reached eta_min. Search therefore uses the full per-model horizon.
  search_scheduler_horizon_epochs: 150
  execution_order: all_methods_once_then_repeats

  methods:
    - id: fresh_optimizer_fresh_scheduler
      model_state: selected_surviving_state
      optimizer_state: fresh
      scheduler_state: fresh_final_stage_cosine
    - id: mapped_optimizer_fresh_scheduler
      model_state: selected_surviving_state
      optimizer_state: mapped_adamw_moments_and_step
      scheduler_state: fresh_final_stage_cosine
    - id: mapped_optimizer_resumed_scheduler
      model_state: selected_surviving_state
      optimizer_state: mapped_adamw_moments_and_step
      scheduler_state: continue_selected_checkpoint_cosine

  # Methods within a repeat receive the same seed and loader order. The runner
  # expands this as method1/r1, method2/r1, method3/r1, then the three r2 jobs.
  repeats:
    - {id: repeat_1, training_seed: 42}
    - {id: repeat_2, training_seed: 43}

dataloaders:
  download_progress: true
accuracy_guided:
  guard:
    train_bn_calibration_batches: 0
  stage_plan:
    - {id: shared_search, kind: search, epochs: 60, commit_allowed: false, selected_checkpoint: null, restart_policy: adamw_cosine_restart}
    - {id: export_only, kind: commit, epochs: 0, commit_allowed: true, selected_checkpoint: null, restart_policy: none}
    - {id: final_recovery, kind: recovery, epochs: 90, commit_allowed: false, selected_checkpoint: null, restart_policy: branch_specific_optimizer_scheduler_handoff}
mlflow:
  run_name: optimizer_scheduler_handoff_60_90_repeats2
run_history:
  run_name: optimizer_scheduler_handoff_60_90_repeats2
