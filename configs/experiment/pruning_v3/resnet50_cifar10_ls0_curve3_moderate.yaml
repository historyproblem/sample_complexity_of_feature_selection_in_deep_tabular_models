# Three new models, smallest planning size first; sizes are not quotas.
# Use the completed curve7_v2/large_18m point (14,848,414 parameters) as the
# existing large-model comparison, without repeating its 150 training epochs.
protocol: resnet50_cifar10_ls0_curve3_moderate_v1
search_config: experiment/pruning_v3/resnet50_cifar10_ls0_curve7_search
recovery_config: experiment/pruning_v3/resnet50_cifar10_ls0_curve7_recovery
reference_output: outputs/baseline/one_shot_dense_reference_seed42
output: outputs/runs/resnet50_cifar10_ls0_curve3_moderate_v1
requested_min_parameters: 3700000
min_keep_ratio: 0.08
search_selection_last_epochs: 30
label_smoothing: 0.0
profiles:
  - id: floor_probe_3p7m
    target_parameters: 3700000
    soft_drop: 0.05
    hard_drop: 0.06
  - id: compact_6m
    target_parameters: 6000000
    soft_drop: 0.015
    hard_drop: 0.018
  - id: middle_10m
    target_parameters: 10000000
    soft_drop: 0.0075
    hard_drop: 0.009
# Hold-band widths: 1 / 0.3 / 0.15 percentage points.
# Keep lambda step and the remaining v2 recipe unchanged.
