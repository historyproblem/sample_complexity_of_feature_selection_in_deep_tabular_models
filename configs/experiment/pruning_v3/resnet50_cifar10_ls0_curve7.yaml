# Study manifest for scripts/launch_resnet50_cifar10_ls0_curve7.py.
# Targets are planning labels, never width quotas or checkpoint-selection inputs.
# Internal-width-only ResNet50 cannot reach the requested 1.5M endpoint: the
# one-channel-per-boundary floor is 2,876,538 parameters. Report that limitation.
