# @package _global_
# Shared search profile for the four-run expected-open-count ablation. The suite
# manifest supplies the two validation-drop pairs and entropy beta in explicit
# per-model overrides. Mask materialization keeps top-K channels per gate
# boundary, with K = round_half_up(sum(raw p_open)). Physical validation is
# performed online; only the current selection winner retains checkpoint bytes.
defaults:
  - /experiment/pruning_v3/epoch_split_auto_60_90_search
  - _self_

accuracy_guided:
  drop_mode: expected_open_count

one_shot:
  checkpoint_retention: online_selection
  # Dense-reference weights are used only to measure the validation curve.
  # Pruning starts from shared_random_seed42.pt, so discard trained dense
  # snapshots after frozen validation and retain initializer + metadata only.
  reference_checkpoint_retention: metadata_only

mlflow:
  run_name: resnet50_cifar10_expected_open_search

run_history:
  run_name: resnet50_cifar10_expected_open_search
