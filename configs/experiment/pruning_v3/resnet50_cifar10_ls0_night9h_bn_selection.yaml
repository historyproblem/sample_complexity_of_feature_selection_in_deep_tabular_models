# The same three profiles as night9h, with physical post-BN checkpoint selection.
# 450 training minutes + 90 reserve is only a plan. The new 18,000 candidate-BN
# forward batches have not been timed, so completion within nine hours is not guaranteed.
protocol: resnet50_cifar10_ls0_night9h_bn_selection_v1
search_config: experiment/pruning_v3/resnet50_cifar10_ls0_bn_selection_search
recovery_config: experiment/pruning_v3/resnet50_cifar10_ls0_bn_selection_recovery
reference_output: outputs/baseline/one_shot_dense_reference_seed42
output: outputs/runs/resnet50_cifar10_ls0_night9h_bn_selection_v1
requested_min_parameters: 3700000
min_keep_ratio: 0.08
search_selection_last_epochs: 30
search_selection_bn_calibration_batches: 200
label_smoothing: 0.0
time_budget:
  hours: 9
  minutes_per_epoch: 1
  reserve_minutes: 90
profiles:
  - id: floor_probe_3p7m
    target_parameters: 3700000
    soft_drop: 0.05
    hard_drop: 0.06
    log_step: auto
  - id: compact_6m_control
    target_parameters: 6000000
    soft_drop: 0.015
    hard_drop: 0.018
    log_step: auto
  - id: compact_6m_half_step
    target_parameters: 6000000
    soft_drop: 0.015
    hard_drop: 0.018
    log_step: 0.46
# Planning sizes are labels rather than quotas. Both lambda-step variants adapt.
