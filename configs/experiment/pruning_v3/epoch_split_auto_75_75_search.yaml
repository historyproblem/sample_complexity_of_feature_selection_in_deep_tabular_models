# @package _global_
# Horizon-aware automatic-step variant. Thirteen warmup epochs are the nearest
# integer to one sixth of the 75-epoch adaptive search horizon.
defaults:
  - /experiment/pruning_v3/epoch_split_75_75_search
  - _self_

training_arguments:
  adaptive_lambda:
    initial_search_warmup: 13
    log_step: auto

mlflow:
  run_name: epoch_split_auto_75_75_search

run_history:
  run_name: epoch_split_auto_75_75_search
