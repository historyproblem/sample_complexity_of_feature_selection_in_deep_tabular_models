# @package _global_

# Channel-level Gumbel gating for Bottleneck-based backbones (ResNet50/101/152),
# using MaskedGumbelBottleneckLayer so previously-disabled channels
# (accumulated across cyclic_channel_pruning cycles, or set explicitly via
# channel_pruning.mask) stay permanently masked while the remaining channels
# keep a live, trainable gate.

optimizer:
  gate_weight_decay_scale: null

model:
  gumbel_init_mode: auto
  bypass_on_zero_lambda: true
  # disabled | plus_negative_entropy | minus_negative_entropy
  entropy_regularization: disabled
  entropy_regularization_coef: 1.0
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  regularization_loss:
    _target_: net_complexity.wrappers.get_gumbel_loss
    _partial_: true
  backbone:
    resnet_block:
      _target_: net_complexity.wrappers.MaskedGumbelBottleneckLayer
      _partial_: true
      beta: 1.0
      force_ones_mask: false
      deterministic_soft_mask: false
      deterministic_hard_mask: false
      train_gate_mode: null
      eval_gate_mode: null
      gate_threshold: 0.5
      # false (default): only conv3's output is gated/prunable — conv1/conv2
      # stay at full width regardless of pruning decisions (see
      # MaskedGumbelBottleneckLayer's docstring).
      # true: two more independent gates are added, on conv1-out/conv2-in
      # and conv2-out/conv3-in, so conv1 and conv2 — usually the bulk of a
      # Bottleneck block's params/FLOPs — become prunable too.
      gate_internal_width: false
