# @package _global_

# Older Gumbel recipes keep gate weight-decay splitting disabled by default.
optimizer:
  gate_weight_decay_scale: null

model:
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  regularization_loss:
    _target_: net_complexity.wrappers.get_gumbel_loss
    _partial_: true
  backbone:
    resnet_block:
      _target_: net_complexity.wrappers.CIFARGumbelBasicBlock
      _partial_: true
      beta: 1.0
