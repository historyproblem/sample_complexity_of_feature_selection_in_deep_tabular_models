# @package _global_
#
# Channel-level Gumbel gating for MobileNetV2 — the counterpart of
# configs/method/gumbel_masked_bottleneck.yaml. MaskedGumbelInvertedResidual
# gates the block's residual-branch output (the `project` conv's output,
# right before the skip sum), so a closed channel is exactly identity for
# that channel — the same semantics the Bottleneck variant gets by gating
# conv3's output.
#
# Channels disabled in earlier cyclic_channel_pruning cycles stay
# permanently masked while the rest keep a live, trainable gate.
#
# gate_internal_width: true adds a second, independent gate on the inverted
# bottleneck's hidden width (expand-out == depthwise == project-in). Unlike
# the output gate it also works on *non-residual* blocks, which raises the
# share of the model the method can reach from ~20% to ~73%. One gate
# suffices where the Bottleneck needs two (mid1/mid2), because depthwise
# preserves channel identity — see MaskedGumbelInvertedResidual.

optimizer:
  gate_weight_decay_scale: null

model:
  gumbel_init_mode: auto
  bypass_on_zero_lambda: true
  # disabled | plus_negative_entropy | minus_negative_entropy
  entropy_regularization: disabled
  entropy_regularization_coef: 1.0
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  regularization_loss:
    _target_: net_complexity.wrappers.get_gumbel_loss
    _partial_: true
  backbone:
    block:
      _target_: net_complexity.wrappers.MaskedGumbelInvertedResidual
      _partial_: true
      beta: 1.0
      force_ones_mask: false
      deterministic_soft_mask: false
      deterministic_hard_mask: false
      train_gate_mode: null
      eval_gate_mode: null
      gate_threshold: 0.5
      gate_internal_width: false
