# @package _global_

training_arguments:
  num_epochs: 250
  lambda_warmup:
    enabled: false
    start_epoch: 30
    initial_lambda_coef: 0.0
    target_lambda_coef: 0.0
    ramp_epochs: 1
    bypass_during_warmup: true
  adaptive_lambda:
    enabled: false
    warmup_epochs: 10
    update_every_epochs: 3
    acc_window: 3
    lambda_min: 1e-8
    lambda_max: 80.0
    log_step_init: 0.6931471805599453
    log_step_min: 0.04879016416943205
    soft_drop: 0.02
    hard_drop: 0.05
    soft_step_shrink: 0.5
    hard_step_shrink: 0.25
    collapse_acc_threshold: 0.15
    collapse_loss_threshold: 2.15
    collapse_zero_prob_threshold: 0.90
    collapse_acc_drop_threshold: 0.40
    rollback_on_collapse: true
    max_rollbacks: 6
    freeze_on_rollback_limit: true
  batchnorm_recalibration:
    enabled: true
    num_batches: 200
    reset_running_stats: true
    train_gate_mode: deterministic_hard
    eval_gate_mode: deterministic_hard
  early_stopping:
    enabled: false  # Skip the per-epoch early stopping check for this recipe.
    patience: 40
    min_epochs: 150
    min_delta: 0.0
  collapse_guard:
    enabled: false
    min_epoch: 35
    patience: 20
    min_epochs_since_best: 20
    acc_threshold_abs: 0.15
    acc_threshold_rel: 0.30
    loss_threshold: 2.25
    zero_threshold: 0.86
