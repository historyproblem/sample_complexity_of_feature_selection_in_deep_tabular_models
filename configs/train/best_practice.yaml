# @package _global_

training_arguments:
  num_epochs: 250
  early_stopping:
    enabled: true
    patience: 40
    min_epochs: 150
    min_delta: 0.0
  collapse_guard:
    enabled: false
    min_epoch: 35
    patience: 20
    min_epochs_since_best: 20
    acc_threshold_abs: 0.15
    acc_threshold_rel: 0.30
    loss_threshold: 2.25
    zero_threshold: 0.86
