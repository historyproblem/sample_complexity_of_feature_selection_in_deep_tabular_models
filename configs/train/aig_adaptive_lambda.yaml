# @package _global_

training_arguments:
  num_epochs: 200
  adaptive_lambda:
    enabled: false
    warmup_epochs: 0
    update_every_epochs: 2
    acc_window: 3
    baseline_history_dir: null
    lambda_min: 1e-8
    lambda_max: 10.0
    log_step_init: auto
    log_step_min: 0.04879016416943205
    soft_drop: 0.02
    hard_drop: 0.05
  batchnorm_recalibration:
    enabled: true
    num_batches: 200
    reset_running_stats: true
    train_gate_mode: deterministic_hard
    eval_gate_mode: deterministic_hard
