  num_epochs: 62
  gradient_norm_logging:
    enabled: false
  lambda_warmup:
    enabled: false
  adaptive_lambda:
    enabled: false
  batchnorm_recalibration:
    enabled: false
  collapse_guard:
    enabled: false
