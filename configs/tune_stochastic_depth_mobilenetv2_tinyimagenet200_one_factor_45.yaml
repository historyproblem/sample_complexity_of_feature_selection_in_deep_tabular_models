defaults:
  - experiment: stochastic_depth_mobilenetv2_tinyimagenet200_45ep
  - tuning: stochastic_depth_mobilenetv2_tinyimagenet200_one_factor_45
  - _self_

# Common SD reference recipe. Each point changes one factor from this recipe.
model:
  backbone:
    dropout: 0.2
    final_survival_probability: 0.5
    survival_schedule: linear

optimizer:
  lr: 0.01
  weight_decay: 0.0005

mlflow:
  tags:
    recipe: stochastic_depth_mobilenetv2_tinyimagenet200_one_factor_45
    expected_active_blocks: "7.25"

hydra:
  run:
    dir: ${tuning.output_dir}/${now:%Y%m%d_%H%M%S}_${tuning.study_name}
  output_subdir: .hydra
