defaults:
  - experiment: stochastic_depth_mobilenetv2_tinyimagenet200_45ep
  - tuning: stochastic_depth_mobilenetv2_tinyimagenet200_params_lr003_45
  - _self_

# Match the latest SD training recipe; target expected executed parameters.
model:
  backbone:
    dropout: 0.2
    survival_schedule: linear

optimizer:
  lr: 0.03
  weight_decay: 0.0005

mlflow:
  tags:
    recipe: stochastic_depth_mobilenetv2_tinyimagenet200_params_lr003_45
    parameter_target_convention: expected_executed_parameters

hydra:
  run:
    dir: ${tuning.output_dir}/${now:%Y%m%d_%H%M%S}_${tuning.study_name}
  output_subdir: .hydra
