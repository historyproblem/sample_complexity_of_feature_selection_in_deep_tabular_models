defaults:
  - experiment: autopruner_mobilenetv2_tinyimagenet200_45ep
  - tuning: autopruner_mobilenetv2_keep_03_09_30_15_ordered
  - _self_

model:
  pretrained_checkpoint: ${hydra:runtime.cwd}/outputs/runs/20261002_194727_baseline_pretrained_mobilenetv2_tinyimagenet200/checkpoints/best.pt
  pruning_epochs_per_stage: 30
  final_fine_tune_epochs: 15

training_arguments:
  num_epochs: 45

run_history:
  min_epoch: 31

mlflow:
  tags:
    recipe: autopruner_mobilenetv2_tinyimagenet200_30_15_sweep
    pruning_epochs: "30"
    fine_tune_epochs: "15"

reporting:
  run_label_fields:
    keep_ratio: model.backbone.target_keep_ratio

hydra:
  run:
    dir: ${tuning.output_dir}/${now:%Y%m%d_%H%M%S}_${tuning.study_name}
  output_subdir: .hydra
