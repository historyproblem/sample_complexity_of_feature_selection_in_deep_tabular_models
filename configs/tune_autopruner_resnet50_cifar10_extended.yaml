defaults:
  - experiment: autopruner_resnet50_cifar10
  - tuning: autopruner_extended_keep_07_02_v100
  - _self_

reporting:
  run_label_fields:
    keep_ratio: model.backbone.target_keep_ratio

# Reuse the exact dense checkpoint used by the earlier keep=0.5/0.3 study.
model:
  pretrained_checkpoint: ${hydra:runtime.cwd}/outputs/runs/20260821_032217_762051_best_practice_resnet50_on_cifar10/checkpoints/best.pt

hydra:
  run:
    dir: ${tuning.output_dir}/${now:%Y%m%d_%H%M%S}_${tuning.study_name}
  output_subdir: .hydra
