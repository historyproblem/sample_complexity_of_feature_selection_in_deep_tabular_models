# @package _global_
#
# tinyimagenet200_resize224.yaml with ImageNet normalisation, for runs that
# start from ImageNet-pretrained weights: their first conv was trained on
# inputs standardised with the ImageNet statistics, not TinyImageNet's own.
#
# Geometry is the same as tinyimagenet200_resize224.yaml — train
# RandomResizedCrop(224, scale 0.6-1.0) + flip, eval Resize(256) ->
# CenterCrop(224), i.e. the same ~4x upscale on both sides. Both pipelines
# are spelled out because the built-in resize/center_crop path normalises
# with the TinyImageNet statistics.

dataloaders:
  _target_: net_complexity.dataloaders.ClassicCVDataloaders
  path_to_data: ${hydra:runtime.cwd}/data/tiny-imagenet-200
  batch_size: 128
  taskname: tinyimagenet200
  num_classes: 200
  image_size: 64
  train_transform:
    _target_: torchvision.transforms.Compose
    transforms:
      - {_target_: torchvision.transforms.RandomResizedCrop, size: 224, scale: [0.6, 1.0]}
      - {_target_: torchvision.transforms.RandomHorizontalFlip}
      - {_target_: torchvision.transforms.ToTensor}
      - {_target_: torchvision.transforms.Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  eval_transform:
    _target_: torchvision.transforms.Compose
    transforms:
      - {_target_: torchvision.transforms.Resize, size: 256}
      - {_target_: torchvision.transforms.CenterCrop, size: 224}
      - {_target_: torchvision.transforms.ToTensor}
      - {_target_: torchvision.transforms.Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  valid_ratio: 0.1
  seed: 42
