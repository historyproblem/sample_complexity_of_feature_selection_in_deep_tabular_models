defaults:
  - experiment: autopruner_mobilenetv2_tinyimagenet200_45ep
  - tuning: autopruner_mobilenetv2_schedule_fixed_keep063_45
  - _self_

model:
  pretrained_checkpoint: ${hydra:runtime.cwd}/outputs/runs/20261002_194727_baseline_pretrained_mobilenetv2_tinyimagenet200/checkpoints/best.pt
  backbone:
    target_keep_ratio: 0.63
    exact_keep_count: true

training_arguments:
  num_epochs: 45

mlflow:
  tags:
    recipe: autopruner_mobilenetv2_tinyimagenet200_schedule_fixed_keep063_45
    exact_keep_count: "true"
    target_keep_ratio: "0.63"

reporting:
  run_label_fields:
    pruning_epochs: model.pruning_epochs_per_stage
    fine_tune_epochs: model.final_fine_tune_epochs

hydra:
  run:
    dir: ${tuning.output_dir}/${now:%Y%m%d_%H%M%S}_${tuning.study_name}
  output_subdir: .hydra
